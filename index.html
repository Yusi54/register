  infw:{f:"INFW", n:"Informations- und Wissensmanagement", sub:"Theorieprüfung am 04.12.", k:[
{"id":"infw-01","t":"Information","f":"Wie wird aus Zeichen Wissen? Nenne die Stufen und was jeweils dazukommt.","r":"<b>Zeichen + Syntax</b> = Daten<br><b>Daten + Bedeutung</b> = Information<br><b>vernetzte Information + Erfahrung</b> = Wissen<br>Wissen lässt uns handeln."},
{"id":"infw-02","t":"Information","f":"Definiere «Information» in einem Satz.","r":"Informationen sind <b>Daten mit Bedeutung</b>: geordnet, in einen Kontext gestellt und nützlich für eine Frage oder Entscheidung (wer, was, wo, wann, wie viel)."},
{"id":"infw-03","t":"Information","f":"Warum ist «Information» schwer zu definieren?","r":"Die Definition variiert je nach <b>Fachgebiet, Sichtweise und Autor</b>, auch in der Wirtschaftsinformatik gibt es <b>keinen Konsens</b>. Einig ist man nur: Von Daten über Information zu Wissen braucht es mehrere Anreicherungsstufen."},
{"id":"infw-04","t":"Information","f":"Dein Beispiel: Daten, Information und Wissen im Betrieb?","r":"<b>Daten:</b> «SRV-EWK01», «95 %»<br><b>Information:</b> Der Server der Einwohnerkontrolle einer Gemeinde ist zu 95 % voll, in etwa drei Tagen ist er voll.<br><b>Wissen:</b> Aus Erfahrung ein Ticket eröffnen und den Speicher erweitern, bevor die Gemeinde etwas merkt."},
{"id":"infw-05","t":"Information","f":"Eselsbrücke für Daten, Information und Wissen?","r":"<b>Daten</b> = was steht da<br><b>Information</b> = was es bedeutet<br><b>Wissen</b> = was ich damit tue"},
{"id":"infw-06","t":"Kompetenzen","f":"Nenne die vier Kompetenzarten und die Eselsbrücke.","r":"<b>Fach-, Methoden-, Selbst- und Sozialkompetenz</b><br>«<b>F</b>achmann <b>M</b>acht <b>S</b>eine <b>S</b>ache»"},
{"id":"infw-07","t":"Kompetenzen","f":"Was ist Selbstkompetenz?","r":"Wie ich <b>mich selbst führe und motiviere</b>: Zeitmanagement, Belastbarkeit, Selbstreflexion, Lernbereitschaft."},
{"id":"infw-08","t":"Kompetenzen","f":"Was ist Sozialkompetenz?","r":"Wie ich <b>mit anderen umgehe und zusammenarbeite</b>: Kommunikation, Teamfähigkeit, Konfliktfähigkeit, Führung."},
{"id":"infw-09","t":"Kompetenzen","f":"Was ist Fachkompetenz?","r":"<b>Konkretes Wissen und Können in meinem Fachbereich</b>, bei dir z. B. Systemtechnik, Netzwerk und die Fachanwendungen der Gemeinden."},
{"id":"infw-10","t":"Kompetenzen","f":"Was ist Methodenkompetenz?","r":"Wie ich <b>an Probleme herangehe und sie löse</b>: strukturiertes Vorgehen, Arbeits- und Lerntechnik, Projektmanagement, Präsentation."},
{"id":"infw-11","t":"Kompetenzen","f":"Wie baust du eine Kompetenz-Antwort auf, damit sie zwei Punkte gibt?","r":"<b>1.</b> Kompetenz benennen und kurz erklären.<br><b>2.</b> Konkret sagen, <b>wie du sie einsetzt</b>: Situation aus deinem Alltag plus Nutzen."},
{"id":"infw-12","t":"Kompetenzen","f":"Wozu dient ein Kompetenzportfolio?","r":"<b>Für dich:</b> Kompetenzen dokumentieren (Diplome, Kurse), Stärken und Lücken erkennen, Bewerbungen.<br><b>Fürs Unternehmen:</b> Kompetenzmatrix mehrerer Mitarbeitender, Abgleich des IST mit dem künftigen Bedarf."},
{"id":"infw-13","t":"Wissensarten","f":"Implizites vs. explizites Wissen?","r":"<b>Implizit:</b> nur im Kopf, Erfahrung und Können, schwer in Worte zu fassen, nicht dokumentiert.<br><b>Explizit:</b> dokumentiert bzw. aufgeschrieben, etwa als Anleitung im Wiki, leicht weiterzugeben."},
{"id":"infw-14","t":"Wissensarten","f":"Individuelles vs. kollektives Wissen?","r":"<b>Individuell:</b> gehört einer einzelnen Person.<br><b>Kollektiv:</b> wird vom Team bzw. der ganzen Organisation geteilt, z. B. gemeinsame Abläufe und Routinen."},
{"id":"infw-15","t":"Wissensarten","f":"Internes vs. externes Wissen?","r":"<b>Intern:</b> stammt aus dem eigenen Unternehmen (Mitarbeitende, Erfahrungen, eigene Doku).<br><b>Extern:</b> kommt von aussen (Kunden, Hersteller, Partner, Hochschulen, Fachliteratur)."},
{"id":"infw-16","t":"Wissensarten","f":"Aus welchem Modell stammen diese drei Gegensatzpaare?","r":"Aus dem <b>Wissenswürfel</b> von Klaus North (2002)."},
{"id":"infw-17","t":"Wissensarten","f":"Welche drei Ziele verfolgt ein Unternehmen mit dem Wissenswürfel?","r":"<b>Implizit → explizit:</b> Erfahrungen dokumentieren<br><b>Individuell → kollektiv:</b> Einzelwissen im Team verankern<br><b>Extern → intern:</b> externes Wissen in die eigenen Abläufe holen"},
{"id":"infw-18","t":"Wissensarten","f":"Eselsbrücke für den Wissenswürfel?","r":"Die drei <b>I</b> bleiben drin: <b>I</b>mplizit (im Kopf), <b>I</b>ndividuell (nur ich), <b>I</b>ntern (nur bei uns). Die Gegenteile gehen raus: explizit, kollektiv, extern."},
{"id":"infw-19","t":"Wissensarten","f":"Je ein Beispiel aus deinem Job für die drei Paare?","r":"<b>Implizit/explizit:</b> Ein Techniker kennt den heiklen Server einer Gemeinde, dieselbe Anleitung steht im Wiki.<br><b>Individuell/kollektiv:</b> Nur ich kenne eine Firewall-Konfiguration, das ganze Team kennt die Onboarding-Checkliste.<br><b>Intern/extern:</b> eigene Ticket-Historie, Doku und Support der Hersteller."},
{"id":"infw-20","t":"Open Innovation","f":"Welches Ziel verfolgt Open Innovation?","r":"Den Innovationsprozess <b>nach aussen öffnen</b>: Wissen und Infos mit <b>externen Partnern teilen</b>, um <b>gemeinsam zu forschen und zu entwickeln</b> (Technologietransfer) und so schneller und besser zu Innovationen zu kommen. «Gemeinsam statt einsam»."},
{"id":"infw-21","t":"Open Innovation","f":"Wer ist bei Open Innovation beteiligt?","r":"Das Unternehmen plus <b>Kunden, Business-Partner, Hochschulen, Forschung und öffentliche Institutionen</b>."},
{"id":"infw-22","t":"Open Innovation","f":"Beispiel für Open Innovation aus dem Unterricht?","r":"Ein <b>Reifenhersteller</b> entwickelt mit einer <b>Hochschule</b> eine neue Gummimischung für Winterreifen."},
{"id":"infw-23","t":"Open Innovation","f":"Open Innovation vs. Crowdsourcing?","r":"<b>Open Innovation:</b> ausgewählte, bekannte Partner, gemeinsame Forschung, Infos vernetzen.<br><b>Crowdsourcing:</b> Die unbekannte Masse online (Öffentlichkeit, Communities) arbeitet gemeinsam an einem Projekt oder Produkt, z. B. Wikipedia, OpenStreetMap."},
{"id":"infw-24","t":"Open Innovation","f":"Wie beantwortest du «Nutzt dein Unternehmen Open Innovation?»","r":"<b>1.</b> Klare Antwort: ja, nein oder nur ansatzweise.<br><b>2.</b> Begründung mit Bezug, z. B.: Ja, wir haben Wissen, Erfahrungen und Strukturen mit der Gemeinde Rorschach und Umgebung geteilt, damit dort eine ähnliche Lösung entstehen konnte, und tauschen uns dauerhaft über gemeinsame Herausforderungen aus."},
{"id":"infw-25","t":"Umweltdynamik","f":"Vier Möglichkeiten, auf Umweltdynamiken zu reagieren, mit Eselsbrücke?","r":"<b>M</b>anagementmethoden einsetzen<br><b>O</b>rganisationsstrukturen anpassen<br><b>P</b>rozessorientierung fördern<br><b>K</b>ultur: Unternehmens- und Kommunikationskultur<br>«Mein Opa Pflegt Kühe»"},
{"id":"infw-26","t":"Umweltdynamik","f":"Warum ist das Reagieren auf Umweltdynamiken schwierig?","r":"Veränderungen passieren <b>schnell</b>, werden vom Unternehmen <b>nicht gesehen (wollen)</b> oder lösen <b>hohe Kosten</b> aus. Grosse Konzerne sind träge, z. B. VW bei der E-Mobilität."},
{"id":"infw-27","t":"Umweltdynamik","f":"Beispiele für aktuelle Umweltdynamiken?","r":"<b>Homeoffice und Teilzeit</b>, immer mehr <b>KI-Anwendungen</b>, <b>Machine Learning</b>. Wer nicht reagiert, verliert Kunden und Umsatz."},
{"id":"infw-28","t":"Umweltdynamik","f":"Managementmethoden: welche, und wie helfen sie?","r":"<b>Strategisches Management</b> (Strategie planen, umsetzen, überwachen, regelmässige Situationsanalyse), <b>Geschäftsprozessmanagement</b>, <b>Informationsmanagement</b>, <b>Ideen- und Innovationsmanagement</b>. So erkennt man Trends früh und reagiert gezielt."},
{"id":"infw-29","t":"Umweltdynamik","f":"Worauf achtest du beim Anpassen von Organisationsstrukturen?","r":"<b>Nicht alles auf einmal</b>, Veränderungen zuerst <b>stabilisieren</b>, zu viele oder zu schnelle Änderungen wirken kontraproduktiv. Grösstes Risiko: Der <b>Kundenfokus</b> geht verloren. Beispiel VW: Werke schliessen, Know-how geht verloren."},
{"id":"infw-30","t":"Umweltdynamik","f":"Wie hilft Prozessorientierung?","r":"Immer gleiche Arbeiten als <b>Prozess standardisieren</b>, den Rest dokumentieren. Eine <b>ISO-Zertifizierung</b> wie ISO 27001 hilft: Prozesse aufbauen, Kennzahlen messen, kontinuierlich verbessern."},
{"id":"infw-31","t":"Umweltdynamik","f":"Wie wirkt die Unternehmens- und Kommunikationskultur?","r":"Sie gibt <b>Orientierung</b> über Vision, Leitbild und Werte, sichtbar in Sprache (Slogans), Handlung (Kommunikation) und Artefakten (Organigramm). Beispiele: <b>Bosch</b> «House of Orientation», <b>Mercedes</b> mit neuem Leitspruch für mehr Kundenorientierung."},
{"id":"infw-32","t":"Umweltdynamik","f":"Wofür steht VUCA?","r":"<b>V</b>olatility (Unbeständigkeit), <b>U</b>ncertainty (Unsicherheit), <b>C</b>omplexity (Komplexität), <b>A</b>mbiguity (Mehrdeutigkeit): ein Modell, um eine immer dynamischere Welt zu erfassen."},
{"id":"infw-33","t":"Umweltdynamik","f":"Was ist KVP und wie läuft der PDCA-Zyklus?","r":"Kontinuierlicher Verbesserungsprozess <b>ohne Start und Ende</b>:<br><b>Plan</b> Verbesserung planen → <b>Do</b> umsetzen → <b>Check</b> Erfolg prüfen → <b>Act</b> Massnahmen einführen"},
{"id":"infw-34","t":"Umweltdynamik","f":"Wie dämmt man die Informationsflut ein?","r":"<b>1.</b> Filtern und Automatisieren: Daten reduzieren, KI fasst Mails und Dokumente zusammen.<br><b>2.</b> Organisatorisch: <b>Single Source of Truth</b> und klare Regeln, was wohin gehört."},
{"id":"infw-35","t":"BSC & KPI","f":"Was ist die Grundidee der Balanced Scorecard?","r":"Die <b>Unternehmensstrategie in konkrete, messbare Ziele und Kennzahlen</b> bzw. Handlungen übersetzen. Ein Messinstrument für die unternehmerische Tätigkeit."},
{"id":"infw-36","t":"BSC & KPI","f":"Die vier Perspektiven der BSC?","r":"<b>Finanzen, Kunden, interne Prozesse, Lernen und Entwicklung</b> (Wachstum)<br>Merkkette von unten: Lernen → Prozesse → Kunden → Finanzen"},
{"id":"infw-37","t":"BSC & KPI","f":"Warum heisst sie «balanced»?","r":"Sie ist <b>ausgewogen</b>: Nicht nur Finanzkennzahlen zählen, sondern auch Kunden, Prozesse und Lernen. Kurz- und langfristige Sicht im Gleichgewicht."},
{"id":"infw-38","t":"BSC & KPI","f":"Was ist die Voraussetzung für eine BSC?","r":"Eine <b>Umfeldanalyse</b> (Branchenstrukturanalyse): intern und extern, jeweils sachlich (Datenschutz, Technik, Know-how) und sozial (Mitarbeitende, Behörden). Kernfrage: Worauf müssen wir alles achten?"},
{"id":"infw-39","t":"BSC & KPI","f":"BSC-Kennzahlen für einen IT-Dienstleister, je Perspektive eine?","r":"<b>Finanzen:</b> Budget-Einhaltung, Ein- und Ausgaben<br><b>Kunden:</b> Zufriedenheit der Gemeinden, Feedback<br><b>Prozesse:</b> Ticketzahlen, Reaktionszeit, Verfügbarkeit aus dem Monitoring<br><b>Lernen:</b> Zertifizierungen, Schulungstage"},
{"id":"infw-40","t":"BSC & KPI","f":"Welche Eigenschaften haben gute KPIs?","r":"<b>Strategisch, ressourcenorientiert, messbar, beeinflussbar, zielverbunden, transparent</b>: Mitarbeitende sehen, was ihre Arbeit zum Ziel beiträgt."},
{"id":"infw-41","t":"BSC & KPI","f":"Wie erarbeitet man KPIs?","r":"<b>1.</b> Unternehmensziele bestimmen<br><b>2.</b> Kennzahlen definieren<br><b>3.</b> KPI mit Bewertungsstufen festlegen, z. B. 25’000 Online-Käufe pro Monat = gut"},
{"id":"infw-42","t":"Weitere Themen","f":"Die Stufen der Wissenstreppe nach North, mit Eselsbrücke?","r":"Zeichen → Daten → Informationen → Wissen → Handeln → Kompetenz → Wettbewerbsfähigkeit<br>«<b>Z</b>wei <b>D</b>ackel <b>I</b>m <b>W</b>ald <b>H</b>olen <b>K</b>eine <b>W</b>urst»"},
{"id":"infw-43","t":"Weitere Themen","f":"Was kommt bei jeder Stufe der Wissenstreppe dazu?","r":"+ Syntax → Daten<br>+ Bedeutung → Informationen<br>+ Vernetzung (Kontext, Erfahrung) → Wissen<br>+ Anwendung und Wollen → Handeln<br>+ richtig handeln → Kompetenz<br>+ Einzigartigkeit → Wettbewerbsfähigkeit"},
{"id":"infw-44","t":"Weitere Themen","f":"Wissenstreppe: strategisch vs. operativ?","r":"<b>Strategisch, top-down:</b> Was macht uns einzigartig? Welche Kompetenzen und welches Wissen brauchen wir?<br><b>Operativ, bottom-up:</b> Daten- und Informationsmanagement aufsetzen → Organisation entwickeln → Strategieprozess."},
{"id":"infw-45","t":"Weitere Themen","f":"SECI: die vier Formen der Wissensumwandlung?","r":"<b>S</b>ozialisation: implizit → implizit<br><b>E</b>xternalisierung: implizit → explizit (die wichtigste)<br><b>C</b> Kombination: explizit → explizit<br><b>I</b>nternalisierung: explizit → implizit"},
{"id":"infw-46","t":"Weitere Themen","f":"SECI: Was löst die vier Phasen aus?","r":"Sozialisation: <b>Feldaufbau</b><br>Externalisierung: <b>Dialog</b><br>Kombination: <b>Verbindung expliziten Wissens</b><br>Internalisierung: <b>Learning by doing</b>"},
{"id":"infw-47","t":"Weitere Themen","f":"SECI: fünf Voraussetzungen für die Wissensspirale?","r":"Intention, Autonomie, Fluktuation und kreatives Chaos, Redundanz, notwendige Vielfalt."},
{"id":"infw-48","t":"Weitere Themen","f":"Probst: die acht Bausteine, mit Eselsbrücke?","r":"<b>Aussen:</b> Wissensziele, Wissensbewertung<br><b>Innen:</b> Identifikation, Erwerb, Entwicklung, (Ver)teilung, Nutzung, Bewahrung<br>«<b>I</b>nge <b>E</b>rbt <b>E</b>ine <b>V</b>illa <b>N</b>ahe <b>B</b>ern»"},
{"id":"infw-49","t":"Weitere Themen","f":"Was ist die Todesspirale der elektronischen Wissensbasis?","r":"Qualität sinkt → Vertrauen sinkt → Nutzung sinkt → keine Investitionen in Aktualisierung → Qualität sinkt weiter."},
{"id":"infw-50","t":"Weitere Themen","f":"Was sagt das TOM-Modell?","r":"Ganzheitliches Wissensmanagement = Zusammenspiel von <b>Mensch</b> (Motivation, Fehlerkultur), <b>Organisation</b> (in Prozesse und Strukturen integriert) und <b>Technik</b> (Systeme zum Speichern und Verteilen)."},
{"id":"infw-51","t":"Weitere Themen","f":"Die vier Lerntheorien in wenigen Worten?","r":"<b>Behaviorismus:</b> Reiz → Reaktion<br><b>Kognitivismus:</b> Informationen verarbeiten<br><b>Konstruktivismus:</b> Wissen selbst konstruieren<br><b>Konnektivismus:</b> Wissen in Netzwerken"},
{"id":"infw-52","t":"Weitere Themen","f":"Klassische vs. operante Konditionierung?","r":"<b>Klassisch (Pawlow):</b> Ein neutraler Reiz wird an einen natürlichen gekoppelt (Glocke + Futter), die Reaktion ist unwillkürlich.<br><b>Operant (Skinner):</b> Die Konsequenz zählt: Belohnung macht ein Verhalten häufiger, Strafe seltener."},
{"id":"infw-53","t":"Weitere Themen","f":"Ziele von Wissensinstrumenten aus Sicht des Unternehmens?","r":"Austausch fördern, <b>Informationsverlust bei Kündigung verhindern</b>, Effizienz der Informationsbeschaffung steigern."},
{"id":"infw-54","t":"Weitere Themen","f":"Lessons Learned: wie läuft es ab?","r":"<b>Sammeln → Analysieren → Dokumentieren → Transferieren</b>, meist am Projektende. Auch Fehler gehören dazu, ohne Sanktionen."},
{"id":"infw-55","t":"Weitere Themen","f":"Best Practice vs. Good Practice?","r":"<b>Best Practice:</b> die beste, mit anderen verglichene und wiederholbare Lösung.<br><b>Good Practice:</b> hinreichend gut, aber nicht die beste."},
{"id":"infw-56","t":"Weitere Themen","f":"Storytelling: Vorteil und Nachteil?","r":"<b>Vorteil:</b> Der Kontext bleibt erhalten, implizites Wissen wird greifbar.<br><b>Nachteil:</b> hoher Zeit- und Personalaufwand, keine schnellen Resultate."},
{"id":"infw-57","t":"Weitere Themen","f":"Was ist eine Wissensstafette?","r":"Moderierte <b>Übergabe von Erfahrungswissen an die Nachfolge</b> vor dem Austritt, eine Form des Expert Debriefing: Auftrag → Wissenslandkarte → Themen priorisieren → Transfergespräche → Übergabemappe."},
{"id":"infw-58","t":"Weitere Themen","f":"Top-Barrieren im Wissensmanagement und was hilft?","r":"Zeitknappheit → Freiräume schaffen<br>Fehlendes Bewusstsein → Mitarbeitende einbeziehen<br>Fehlende Anreize → wissensfördernde Kultur<br>Ungeeignete Tools → Benutzerfreundlichkeit<br>Abteilungskonkurrenz → Partnerkultur"},
{"id":"infw-59","t":"Weitere Themen","f":"Was ist eine lernende Organisation?","r":"Eine <b>anpassungsfähige</b> Organisation, die auf <b>äussere und innere Reize</b> reagiert."},
{"id":"infw-60","t":"Weitere Themen","f":"Was ist Informationsmanagement?","r":"<b>Planung, Überwachung, Steuerung und Nutzung</b> der Ressource Information: die richtigen Daten zur richtigen Zeit zur richtigen Person. Ohne Informationsmanagement kein Wissensmanagement."},
{"id":"infw-61","t":"Weitere Themen","f":"Innovationsmanagement: Ablauf und Merksatz?","r":"Ideen sammeln → bewerten → Produktentwicklung → Tests mit Kunden → Marketing → Vertrieb<br>«Eine Idee wird erst durch ihre Umsetzung zur Innovation.»"},
{"id":"infw-62","t":"Weitere Themen","f":"Persönliches Wissensmanagement: die vier Herausforderungen?","r":"Datenflut filtern, lebenslanges Lernen, Wissen teilen und weitergeben, ehrliche Selbstreflexion."},
{"id":"infw-63","t":"Weitere Themen","f":"Warum steigt der Wert von Wissen, wenn man es teilt?","r":"<b>Netzwerkeffekt:</b> Anders als physisches Anlagevermögen wird Wissen wertvoller, je mehr Personen es nutzen."}
]},
  lead:{f:"LEAD", n:"Leadership", sub:"Onlinetests und Folien Block 2 bis 4", k:[
{"id":"lead-01","t":"Mitarbeiterführung 1","f":"Welche drei psychologischen Grundbedürfnisse nennt die Selbstbestimmungstheorie (Deci & Ryan)?","r":"<b>Autonomie, Kompetenz, Verbundenheit</b> (in den Folien: «Bindung»).<br>Falle: «Bindung, Orientierung/Kontrolle, Selbstwert» klingt ähnlich, gehört aber zu einem anderen Modell (Grawe). «Sicherheit, Nahrung, Schlaf» sind physiologische Bedürfnisse.","x":1},
{"id":"lead-02","t":"Mitarbeiterführung 1","f":"Wodurch unterscheiden sich psychologische von physiologischen Grundbedürfnissen?","r":"Psychologische Bedürfnisse sind <b>wachstumsorientiert</b>: Ihre Erfüllung fördert <b>intrinsische Motivation</b>.<br>Physiologische Bedürfnisse sind Defizit-Bedürfnisse (gestillt = Ruhe). Psychologische sind weder nur erlernt noch nur in der Kindheit relevant.","x":1},
{"id":"lead-03","t":"Mitarbeiterführung 1","f":"Wann steigt laut Deci & Ryan die intrinsische Motivation besonders?","r":"Wenn <b>Autonomie, Kompetenz und Verbundenheit erlebt</b> werden.<br>Kontrolle, Sanktionen, strikte Fristen und rein materielle Belohnung wirken dagegen.","x":1},
{"id":"lead-04","t":"Mitarbeiterführung 1","f":"Was bedeutet Autonomie im Sinn der Selbstbestimmungstheorie?","r":"<b>Handeln im Einklang mit eigenen Werten und Interessen, frei von Zwang.</b><br>Nicht gemeint: völlige Unabhängigkeit, Egoismus oder das Vermeiden von Verpflichtungen.","x":1},
{"id":"lead-05","t":"Mitarbeiterführung 1","f":"Wie beschreiben die Folien die drei Grundbedürfnisse in je einem Satz?","r":"· <b>Autonomie</b> = selbst entscheiden: handeln und entscheiden im Einklang mit den eigenen Werten<br>· <b>Kompetenz</b> = wirksam sein: Fähigkeiten zeigen und sich weiterentwickeln<br>· <b>Bindung</b> = verbunden sein: sich einer Gruppe zugehörig fühlen"},
{"id":"lead-06","t":"Mitarbeiterführung 1","f":"Welche sechs Stufen hat das Motivationskontinuum (von fremd- zu selbstbestimmt)?","r":"1. <b>Amotivation</b> (Nicht-Regulation): keine Handlungsabsicht<br>2. <b>Externale Regulation</b>: äusserer Druck (Belohnung, Bestrafung)<br>3. <b>Introjizierte Regulation</b>: innerer Druck (Scham, schlechtes Gewissen, Selbstachtung)<br>4. <b>Identifizierte Regulation</b>: bewusste persönliche Wertschätzung der Handlung<br>5. <b>Integrierte Regulation</b>: Übereinstimmung mit eigenen Werten und Bedürfnissen<br>6. <b>Intrinsische Regulation</b>: Neugier und Freude<br>Stufen 2–5 sind alle extrinsisch, werden aber immer autonomer."},
{"id":"lead-07","t":"Mitarbeiterführung 1","f":"Wann entsteht Flow?","r":"Wenn <b>Anforderungen und Fähigkeiten zusammenpassen</b>. Zu hohe Anforderungen führen zu Überforderung (Stress, Panik), zu tiefe zu Unterforderung (Langeweile, «Bore-out»)."},
{"id":"lead-08","t":"Mitarbeiterführung 1","f":"Welche Zonen zeigt das Komfortzonen-Modell (Jenewein) und was heisst das fürs Führen?","r":"Bore-out-Zone → Flow-Zone (Eustress, gesunde Herausforderung) → Panik-Zone (Distress).<br>Wachstum durch <b>kleine, regelmässige Schritte</b> aus der Komfortzone: reflektieren, Feedback beim Team einholen, etwas delegieren («Vertrauen üben»), wöchentliche <b>«Eat the Frog»</b>-Zeit für Unangenehmes."},
{"id":"lead-09","t":"Mitarbeiterführung 1","f":"Was sagt Herzbergs Zwei-Faktoren-Theorie?","r":"· <b>Hygienefaktoren</b> (Lohn, Arbeitsbedingungen, Sicherheit): verhindern Unzufriedenheit, motivieren aber nicht.<br>· <b>Motivatoren</b> (Anerkennung, Verantwortung, sinnvolle Arbeit, Entwicklung): erzeugen Zufriedenheit und Motivation.<br>(In den Folien nur als Grafik, Erklärung aus der Theorie ergänzt.)"},
{"id":"lead-10","t":"Mitarbeiterführung 1","f":"Was ist mit «Sinn» gemeint?","r":"Es geht um das <b>Warum</b>: Menschen leisten mehr, wenn sie den Zweck ihrer Arbeit verstehen. Motto der Folien: «Make work to play» (inspirierend, sinnhaft, exklusiv)."},
{"id":"lead-11","t":"Mitarbeiterführung 1","f":"Welche sechs Grundhaltungen hat ein Coach?","r":"1. <b>Nichtwissenshaltung</b>: Der Coachee findet die beste Lösung selbst, der Coach fragt statt vorzugeben<br>2. <b>Ressourcen- und Zielorientierung</b>: Stärken erkennen, eigene Ziele formulieren lassen<br>3. <b>Freiwilligkeit</b><br>4. <b>Verantwortung beim Coachee</b><br>5. <b>Vertraulichkeit</b><br>6. <b>Präsenz</b>: volle Aufmerksamkeit, aktives Zuhören"},
{"id":"lead-12","t":"Mitarbeiterführung 1","f":"Welche fünf Techniken gehören zum aktiven Zuhören?","r":"1. <b>Paraphrasieren</b>: «Wenn ich dich richtig verstehe …»<br>2. <b>Zusammenfassen</b>: die Kernpunkte kurz wiedergeben<br>3. <b>Offene Fragen stellen</b>: «Was hat dich dazu bewegt …?»<br>4. <b>Emotionen spiegeln</b>: «Es klingt, als wärst du frustriert.»<br>5. <b>Bestätigen</b>: verbal und nonverbal zeigen, dass man folgt"},
{"id":"lead-13","t":"Mitarbeiterführung 1","f":"Welche drei Hindernisse erschweren aktives Zuhören?","r":"Vorurteile und Annahmen · innere Ablenkungen (eigene Probleme, schon an Lösungen denken) · Zeitdruck."},
{"id":"lead-14","t":"Mitarbeiterführung 1","f":"Wofür steht GROW, und wie viel Zeit bekommt jede Phase?","r":"<b>G</b>oal: Was willst du erreichen? · ca. 15 %<br><b>R</b>eality: Wie ist die Situation, was wurde schon versucht? · ca. 35 %<br><b>O</b>ptions: Welche Ideen gibt es, und welche noch? · ca. 30 %<br><b>W</b>ay: Was tun wir konkret, in welcher Reihenfolge? · ca. 20 %<br>Quelle: John Whitmore. In den Folien ist jede Phase einem Element zugeordnet: Goal = Feuer, Reality = Erde, Options = Luft, Way = Wasser."},
{"id":"lead-15","t":"Mitarbeiterführung 1","f":"Woran erkennt man ein gutes GROW-Gespräch (Beobachtungsbogen)?","r":"Ziel klar vereinbart · aktives Zuhören · offene, nicht führende Fragen · Optionen erarbeitet («Was noch?») · konkreter nächster Schritt vereinbart."},
{"id":"lead-16","t":"Mitarbeiterführung 1","f":"Wie definiert Peter Drucker Leadership (Repetition Block 1)?","r":"Nicht Leute dazu bringen, Dinge zu tun, die sie nicht wollen, sondern sie <b>befähigen, Dinge zu leisten, die sie sich nie zugetraut hätten</b>. Dazu: BHAG definieren, «Leaders create leaders, not followers»."},
{"id":"lead-17","t":"Mitarbeiterführung 2","f":"Warum ist Delegieren wichtig?","r":"Es ermöglicht den <b>Fokus auf die eigenen Kernaufgaben</b>. (Es ist keine Form der Kontrolle und erhöht die eigene Arbeitslast nicht.)","x":1},
{"id":"lead-18","t":"Mitarbeiterführung 2","f":"Welche Gefühle kann eine Führungskraft beim Delegieren haben? (Mehrfachauswahl)","r":"<b>Schuld</b> (anderen Arbeit aufbürden) und <b>Verlustängste</b> (Kontrolle, Einfluss oder die eigene Unersetzlichkeit verlieren).<br>Nicht: Gleichgültigkeit, Langeweile.","x":1},
{"id":"lead-19","t":"Mitarbeiterführung 2","f":"Woran erkennt man, dass eine Aufgabe delegiert werden sollte? (Mehrfachauswahl)","r":"· Die Aufgabe könnte sich <b>in Zukunft wiederholen</b><br>· Die Aufgabe ist <b>dringend, aber nicht wichtig</b><br>· <b>Jemand kann sich dabei weiterentwickeln</b><br>Nicht delegieren: Aufgaben von grösster Wichtigkeit.","x":1},
{"id":"lead-20","t":"Mitarbeiterführung 2","f":"Welches Prinzip hilft, Aufgaben zum Delegieren zu finden?","r":"Das <b>Eisenhower-Prinzip</b> (wichtig/dringend-Matrix):<br>wichtig + dringend = sofort selbst · wichtig + nicht dringend = terminieren · <b>dringend + nicht wichtig = delegieren</b> · weder noch = weglassen.","x":1},
{"id":"lead-21","t":"Mitarbeiterführung 2","f":"Was ist ein Vorteil von Delegieren?","r":"<b>Höhere Effizienz und Qualität.</b> Delegieren senkt ausserdem die Zahl der «Single Points of Failure» und fördert Motivation und Kreativität im Team.","x":1},
{"id":"lead-22","t":"Teamführung","f":"Welche Aussagen zur Beta-Position nach Schindler treffen zu? (Mehrfachauswahl)","r":"· <b>Bringt fachliche Expertise in die Gruppe ein</b> (Beta = Experte/Berater)<br>· <b>Vermittelt häufig zwischen Alpha und der Gruppenbasis</b><br>Falsch: «isoliert und ohne Einfluss auf Alpha» (Beta berät Alpha) und «in offener Opposition» (das ist Omega).","x":1},
{"id":"lead-23","t":"Teamführung","f":"Welche Position ist bei Schindler die führende Rolle mit direktem Einfluss auf die Gruppe?","r":"<b>Alpha.</b> Alpha gibt die Richtung vor und vertritt die Gruppe nach aussen.","x":1},
{"id":"lead-24","t":"Teamführung","f":"Welche Tuckman-Phase sollen Teams möglichst schnell erreichen und möglichst lange halten?","r":"<b>Performing</b>: Das Team arbeitet eingespielt und leistungsfähig.","x":1},
{"id":"lead-25","t":"Teamführung","f":"In welcher Tuckman-Phase treten Konflikte um Rollen, Macht und Werte offen zutage?","r":"<b>Storming.</b>","x":1},
{"id":"lead-26","t":"Teamführung","f":"Richtig oder falsch: (a) Die ersten vier Tuckman-Phasen sind Forming, Storming, Norming, Performing. (b) Schindler beschreibt vier Rollen. (c) Omega ist die schweigende Mehrheit. (d) Gamma ist der oppositionelle Pol.","r":"<b>(a) richtig, (b) richtig</b> (Alpha, Beta, Gamma, Omega).<br><b>(c) und (d) falsch, die Rollen sind vertauscht:</b> Gamma ist die Mehrheit der Mitläufer, Omega ist der oppositionelle Pol (Aussenseiter, oft Sündenbock).","x":1},
{"id":"lead-27","t":"Teamführung","f":"Die vier rangdynamischen Positionen nach Schindler","r":"<b>Alpha</b>: Führt, gibt die Richtung vor<br><b>Beta</b>: Experte/Berater, unterstützt Alpha fachlich, relativ unabhängig<br><b>Gamma</b>: Mitglieder, die Alpha folgen (die Mehrheit)<br><b>Omega</b>: Gegenpol, kritisiert, wird leicht zum Sündenbock, zeigt aber oft verdeckte Probleme der Gruppe"},
{"id":"lead-28","t":"Teamführung","f":"Die Teamphasen nach Tuckman","r":"1. <b>Forming</b>: kennenlernen, höflich, unsicher<br>2. <b>Storming</b>: Konflikte um Rollen, Macht und Werte<br>3. <b>Norming</b>: Regeln und Rollen klären sich, Wir-Gefühl<br>4. <b>Performing</b>: volle Leistung<br>5. (später ergänzt) <b>Adjourning</b>: Auflösung, Abschied"}
]},
  cm:{f:"CM", n:"Change Management", sub:"Modelle aus Kapitel 1 bis 6", k:[
{"id":"cm-01","t":"Grundlagen","f":"Welche drei Voraussetzungen braucht eine Veränderung?","r":"<b>Bedarf, Bereitschaft, Fähigkeit.</b><br>Fehlt eine davon, scheitert der Wandel: Die Leute sehen keinen Grund, wollen nicht oder können nicht."},
{"id":"cm-02","t":"Grundlagen","f":"Sach- und Beziehungsebene: Was sagt das Eisbergmodell im Change?","r":"Sichtbar ist nur die <b>Sachebene</b> (Ziele, Pläne, Strukturen). Unter Wasser liegt die <b>Beziehungsebene</b> (Gefühle, Ängste, Werte), und sie entscheidet über den Erfolg."},
{"id":"cm-03","t":"Grundlagen","f":"Auf welchen drei Ebenen wirkt Change?","r":"<b>Mikro</b> (einzelne Person), <b>Meso</b> (Team, Organisation), <b>Makro</b> (Umfeld, Gesellschaft)."},
{"id":"cm-04","t":"Grundlagen","f":"Nenne typische Auslöser für Change.","r":"Kundenbedürfnisse, Innovation und Technologie, agile Transformation, Wettbewerb. Intern (z. B. neue Strategie) oder extern (Umweltsphären)."},
{"id":"cm-05","t":"Umgang mit Veränderung","f":"Die sieben Phasen der Veränderungskurve?","r":"Schock → Verneinung → Einsicht → Akzeptanz → Ausprobieren → Erkenntnis → Integration"},
{"id":"cm-06","t":"Umgang mit Veränderung","f":"Was beschreibt das Vier-Zimmer-Modell?","r":"Menschen durchlaufen im Wandel vier Zimmer: <b>Zufriedenheit → Verleugnung → Verwirrung → Erneuerung</b>. Führen heisst, die Leute durch die Zimmer zu begleiten statt sie zu überspringen."},
{"id":"cm-07","t":"Umgang mit Veränderung","f":"Wie geht man mit Widerstand um?","r":"«Widerstand enthält immer eine Botschaft.» Ernst nehmen, nachfragen, <b>Betroffene zu Beteiligten machen</b>."},
{"id":"cm-08","t":"Planen & steuern","f":"Die drei Phasen nach Lewin?","r":"<b>Unfreeze</b> (auftauen) → <b>Move</b> (verändern) → <b>Refreeze</b> (festigen)"},
{"id":"cm-09","t":"Planen & steuern","f":"Die acht Schritte nach Kotter?","r":"1. Dringlichkeit erzeugen<br>2. Führungskoalition aufbauen<br>3. Vision und Strategie entwickeln<br>4. Vision kommunizieren<br>5. Hindernisse beseitigen, Mitarbeitende befähigen<br>6. Kurzfristige Erfolge sichtbar machen<br>7. Erfolge konsolidieren, weiter verändern<br>8. Neues in der Kultur verankern"},
{"id":"cm-10","t":"Planen & steuern","f":"Wofür steht ADKAR?","r":"<b>A</b>wareness (Bewusstsein) · <b>D</b>esire (Wille) · <b>K</b>nowledge (Wissen) · <b>A</b>bility (Fähigkeit) · <b>R</b>einforcement (Verankerung)<br>Hinweis des Dozenten: kam 2025 an der eidg. Berufsprüfung."},
{"id":"cm-11","t":"Planen & steuern","f":"Wozu dient ein Sounding Board?","r":"Eine Gruppe von Betroffenen, die dem Projekt laufend Rückmeldung gibt: Stimmung, Sorgen und blinde Flecken werden früh sichtbar."},
{"id":"cm-12","t":"Begleiten & umsetzen","f":"Welche Führungsrollen gibt es im Change?","r":"<b>Change Agent</b> (treibt an), <b>Facilitator</b> (begleitet, moderiert), <b>Leader</b> (gibt Richtung und Sinn)."},
{"id":"cm-13","t":"Begleiten & umsetzen","f":"Welche vier Arten von Massnahmen setzt man im Team um?","r":"<b>Kommunikation</b> (Kick-off, Jour fixe), <b>Entwicklung</b> (Schulung, Coaching), <b>Mitwirkung</b> (Workshops), <b>Teamentwicklung</b>."},
{"id":"cm-14","t":"Begleiten & umsetzen","f":"Die Teamphasen nach Tuckman?","r":"Forming → Storming → Norming → Performing"},
{"id":"cm-15","t":"Begleiten & umsetzen","f":"Was ist das Führungssandwich?","r":"Führungskräfte der mittleren Ebene stehen zwischen den Vorgaben von oben und den Reaktionen von unten und müssen beides aushalten und übersetzen."},
{"id":"cm-16","t":"Prüfung","f":"Wie beantwortest du die Bewerbungsfrage zu Change?","r":"Mit einem <b>SAR-Beispiel</b>: <b>S</b>ituation, <b>A</b>ktion, <b>R</b>esultat aus einem eigenen Change."}
]}
};

const WEITERE = [
  {n:"Wissenstreppe", frage:"Erkläre die Wissenstreppe nach North und zeige an einem Beispiel aus deinem Unternehmen, wie aus Daten Wettbewerbsfähigkeit wird.",
   kern:"Zeichen → Daten → Informationen → Wissen → Handeln → Kompetenz → Wettbewerbsfähigkeit. Jede Stufe braucht etwas Zusätzliches.",
   a:"Aus <b>Zeichen</b> werden mit Syntax <b>Daten</b>, mit Bedeutung <b>Informationen</b>, mit Vernetzung und Erfahrung <b>Wissen</b>. Wird Wissen angewendet, entsteht <b>Handeln</b>, richtiges Handeln ist <b>Kompetenz</b>, und einzigartige Kompetenz bringt <b>Wettbewerbsfähigkeit</b>.<br><br><b>Bei uns:</b> Monitoring-Werte (Daten) zeigen, dass ein Server einer Gemeinde bald voll ist (Information). Wir wissen aus Erfahrung, was zu tun ist (Wissen), erweitern rechtzeitig (Handeln) und verhindern so Ausfälle zuverlässig (Kompetenz). Das macht uns für Gemeinden zum verlässlichen Partner (Wettbewerbsfähigkeit)."},
  {n:"SECI-Modell", frage:"Beschreibe die vier Formen der Wissensumwandlung nach Nonaka und Takeuchi mit je einem Beispiel aus deinem Betrieb.",
   kern:"Sozialisation, Externalisierung, Kombination, Internalisierung: Wissen wandert zwischen implizit und explizit.",
   a:"<b>Sozialisation</b> (implizit → implizit): Ein neuer Techniker schaut einem erfahrenen über die Schulter.<br><b>Externalisierung</b> (implizit → explizit): Der erfahrene Techniker schreibt sein Vorgehen als Anleitung ins Wiki.<br><b>Kombination</b> (explizit → explizit): Mehrere Anleitungen werden zu einem Betriebshandbuch zusammengeführt.<br><b>Internalisierung</b> (explizit → implizit): Jemand arbeitet nach dem Handbuch, bis er es auswendig kann (Learning by doing)."},
  {n:"Wissensbausteine", frage:"Nenne die Bausteine des Wissensmanagements nach Probst und erkläre, wo dein Unternehmen eine Schwäche hat.",
   kern:"Aussen: Wissensziele und Wissensbewertung. Innen: Identifikation, Erwerb, Entwicklung, Verteilung, Nutzung, Bewahrung.",
   a:"Die acht Bausteine sind <b>Wissensziele, Identifikation, Erwerb, Entwicklung, Verteilung, Nutzung, Bewahrung und Bewertung</b>.<br><br><b>Schwäche bei uns (Beispiel):</b> die <b>Bewahrung</b>. Viel Wissen steckt in den Köpfen einzelner Techniker. Geht jemand, geht das Wissen mit. Massnahme: Wissensstafette vor dem Austritt und Pflicht zur Dokumentation im Wiki."},
  {n:"TOM-Modell", frage:"Was sagt das TOM-Modell aus? Wende es auf die Einführung eines neuen Wikis in deinem Unternehmen an.",
   kern:"Ganzheitliches Wissensmanagement braucht Technik, Organisation und Mensch zusammen.",
   a:"<b>Technik:</b> Das Wiki muss einfach bedienbar und überall erreichbar sein.<br><b>Organisation:</b> Es braucht Zuständigkeiten, feste Zeit für die Dokumentation und klare Regeln, was wohin gehört.<br><b>Mensch:</b> Die Mitarbeitenden müssen motiviert sein, ihr Wissen zu teilen, und es braucht eine Fehlerkultur.<br><br>Fehlt ein Teil, wird das Wiki nicht genutzt. Ein Tool allein reicht nicht."},
  {n:"Lerntheorien", frage:"Erkläre zwei Lerntheorien und wie du sie beim Einarbeiten neuer Mitarbeitender nutzen würdest.",
   kern:"Behaviorismus (Reiz und Reaktion), Kognitivismus (Informationen verarbeiten), Konstruktivismus (Wissen selbst aufbauen).",
   a:"<b>Behaviorismus:</b> Lernen durch Reiz, Reaktion und Rückmeldung. <i>Einsatz:</i> Sofortiges Feedback und Lob, wenn ein Ticket sauber gelöst ist.<br><br><b>Konstruktivismus:</b> Wissen wird selbst aus Erfahrung aufgebaut. <i>Einsatz:</i> Neue Mitarbeitende lösen früh echte Fälle in einer Testumgebung, statt nur Handbücher zu lesen.<br><br>Dazu passt der <b>Kognitivismus:</b> Wissen strukturiert vermitteln, zum Beispiel mit Checklisten und Übersichten."},
  {n:"Wissensinstrumente", frage:"Ein langjähriger Mitarbeiter verlässt dein Unternehmen. Welche zwei Instrumente setzt du ein, damit sein Wissen bleibt? Begründe.",
   kern:"Wissensstafette (Expert Debriefing), Lessons Learned, Storytelling, Best Practice Sharing, Wiki.",
   a:"<b>1. Wissensstafette:</b> eine moderierte Übergabe an die Nachfolge vor dem Austritt, mit Wissenslandkarte und priorisierten Themen. Sie sichert das Erfahrungswissen, das nirgends steht.<br><br><b>2. Dokumentation im Wiki oder Storytelling:</b> Er hält seine wichtigsten Fälle und Lösungen fest. So wird implizites Wissen explizit und bleibt für alle auffindbar.<br><br>Ziel aus Sicht des Unternehmens: kein Informationsverlust bei einer Kündigung."},
  {n:"Barrieren", frage:"Nenne drei Barrieren im Wissensmanagement und wie sie zu Erfolgsfaktoren werden.",
   kern:"Zeitknappheit, fehlendes Bewusstsein, fehlende Anreize, ungeeignete Tools, Konkurrenz unter Abteilungen.",
   a:"<b>Zeitknappheit</b> → zeitliche Freiräume für Wissensarbeit schaffen.<br><b>Fehlende Anreize</b> → eine wissensfördernde Unternehmenskultur aufbauen.<br><b>Ungeeignete Tools</b> → auf Benutzerfreundlichkeit und einfache Bedienung achten.<br><br>Weitere: fehlendes Bewusstsein → Mitarbeitende in Entscheidungen einbeziehen. Konkurrenz unter Abteilungen → Partnerkultur fördern."},
  {n:"Lernende Organisation", frage:"Was ist eine lernende Organisation, und woran erkennst du, ob dein Unternehmen eine ist?",
   kern:"Eine anpassungsfähige Organisation, die auf äussere und innere Reize reagiert und sich laufend verbessert (KVP, PDCA).",
   a:"Eine <b>lernende Organisation</b> reagiert auf Veränderungen von innen und aussen und passt sich an. Merkmale sind eine gemeinsame Vision, Fehlertoleranz, Teamgeist und Prozessorientierung. Sie verbessert sich laufend nach dem <b>KVP</b> mit dem Zyklus <b>Plan, Do, Check, Act</b>.<br><br><b>Bei uns:</b> Nach jeder grösseren Störung besprechen wir, was schiefging, und passen die Checkliste an. Das ist ein Ansatz. Es fehlt noch, dass dies überall verbindlich geschieht."},
  {n:"Open Innovation und Crowdsourcing", frage:"Worin unterscheiden sich Open Innovation und Crowdsourcing? Gib je ein Beispiel.",
   kern:"Open Innovation: ausgewählte, bekannte Partner. Crowdsourcing: die unbekannte Masse im Internet.",
   a:"<b>Open Innovation</b> öffnet die Innovation für ausgewählte Partner wie Kunden, Hochschulen oder andere Organisationen. Beispiel: Ein Reifenhersteller entwickelt mit einer Hochschule eine neue Gummimischung.<br><br><b>Crowdsourcing</b> lässt eine offene, unbekannte Masse mitarbeiten. Beispiele: Wikipedia, OpenStreetMap."},
  {n:"KPI", frage:"Welche Eigenschaften hat ein guter KPI? Entwickle einen KPI für dein Team.",
   kern:"Strategisch, ressourcenorientiert, messbar, beeinflussbar, zielverbunden, transparent. Vorgehen: Ziel → Kennzahl → KPI mit Bewertungsstufen.",
   a:"Ein guter KPI ist <b>strategisch, messbar, beeinflussbar, mit einem Ziel verbunden und transparent</b>.<br><br><b>Beispiel:</b><br>1. Unternehmensziel: Die Gemeinden erhalten schnelle Hilfe.<br>2. Kennzahl: Anteil der Tickets mit einer Antwort innert 4 Stunden.<br>3. KPI: unter 70 % schlecht · 70 bis 84 % genügend · 85 bis 94 % gut · ab 95 % hervorragend."},
  {n:"Wissensmanagement in der Praxis", frage:"Was hat Xerox oder Accenture im Wissensmanagement umgesetzt, und was lernst du daraus für dein Unternehmen?",
   kern:"Xerox: Communities of Practice, Eureka, Mentoren. Accenture: Knowledge Xchange mit klaren Rollen. Lehre: Technik allein reicht nicht.",
   a:"<b>Accenture</b> baute ab 1992 die weltweite Wissensdatenbank <b>Knowledge Xchange</b>. Die erste Version war eine offene Sammelstelle und wurde unübersichtlich. Erst mit klaren Rollen (Chief Knowledge Officer, Knowledge Integrator, Knowledge Champion) und fester Struktur funktionierte sie.<br><br><b>Xerox</b> förderte den Austausch der Service-Techniker in Communities of Practice und speicherte Tipps in der Datenbank Eureka.<br><br><b>Lehre für uns:</b> Ein Tool allein genügt nicht. Es braucht Zuständige, Struktur und eine Kultur, in der Wissen geteilt wird."}
];

/* ====================== TERMINE & PRÜFUNGEN: ANSICHTEN ====================== */
const WT = ["So","Mo","Di","Mi","Do","Fr","Sa"], MON = ["Jan","Feb","Mär","Apr","Mai","Jun","Jul","Aug","Sep","Okt","Nov","Dez"],
      MONL = ["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"];
const fcVar = f => `--fc:${(FACH[f]||FACH.HF).c}`;
const fName = (f,kurz) => { const x=FACH[f]||FACH.HF; return kurz?(x.kn||x.n):x.n; };
const tag0 = d => { const x=new Date(d); x.setHours(0,0,0,0); return x; };
const iso = d => d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const tageBis = d => Math.round((tag0(d)-tag0(new Date()))/864e5);
const relTage = n => n===0?"heute":n===1?"morgen":n>1?"in "+n+" Tagen":n===-1?"gestern":"vor "+(-n)+" Tagen";
const fmtD = (d,jahr) => WT[d.getDay()]+" "+String(d.getDate()).padStart(2,"0")+"."+String(d.getMonth()+1).padStart(2,"0")+"."+(jahr?d.getFullYear():"");
const zeit = t => t.art==="a" ? "Frist "+t.von+" Uhr" : t.von+(t.bis?"–"+t.bis:"")+" Uhr";
const kw = d => { const x=tag0(d); x.setDate(x.getDate()+3-((x.getDay()+6)%7)); const w1=new Date(x.getFullYear(),0,4); return 1+Math.round(((x-w1)/864e5-3+((w1.getDay()+6)%7))/7); };
const pDatum = p => new Date(p.d+"T"+(p.von||"08:00")+":00");

function ring(n, max, label){
  const r=31, u=2*Math.PI*r, a=Math.max(0,Math.min(1, 1-(Math.max(n,0)/max)));
  return `<div class="ring"><svg viewBox="0 0 76 76" aria-hidden="true"><circle class="bg" cx="38" cy="38" r="${r}"/><circle class="fg" cx="38" cy="38" r="${r}" stroke-dasharray="${u.toFixed(1)}" stroke-dashoffset="${(u*(1-a)).toFixed(1)}"/></svg><div><b>${n<0?"✓":n}</b><span>${n<0?"vorbei":label||(n===1?"Tag":"Tage")}</span></div></div>`;
}
function naechsterTermin(){ const j=new Date(); return TERMINE.find(t=>t.art!=="a" && (t.bis?t.te:new Date(t.ts.getTime()+36e5))>=j); }
function naechstePruef(){ const j=tag0(new Date()); return PRUEF.find(p=>tag0(pDatum(p))>=j); }

function nowCard(mitKnopf){
  const t = naechsterTermin(), p = naechstePruef(), j = new Date();
  if(!t && !p) return "";
  const laeuft = t && t.ts<=j && t.te>=j, n = t?tageBis(t.ts):0;
  const links = t ? `
    <div>
      <div class="kicker">${laeuft?'<span class="live"></span>Läuft jetzt':"Als Nächstes · "+relTage(n)}</div>
      <h2>${esc(fName(t.f,true))} <span>${esc(t.t)}</span></h2>
      <div class="now-m">${fmtD(t.ts)} · ${zeit(t)}${t.f!=="HF"?" · "+ORT:""}</div>
      ${t.th?`<p>${esc(t.th)}</p>`:""}
      ${mitKnopf?`<div class="acts"><button class="btn" type="button" data-go="termine">Alle Termine</button></div>`:""}
    </div>` : `<div><div class="kicker">Semester</div><h2>Kein Unterricht mehr geplant</h2></div>`;
  const pn = p?tageBis(pDatum(p)):0;
  const rechts = p ? `<button class="now-ex fc" type="button" data-go="pruefungen" style="${fcVar(p.f)}">
      ${ring(pn, 60)}
      <span><small>${esc(p.art)} · ${fmtD(pDatum(p))}</small><b>${esc(p.n)}</b><small>${esc(fName(p.f,true))}</small></span></button>` : "";
  return `<section class="now fc" style="${fcVar(t?t.f:p.f)};--fc2:${p?(FACH[p.f]||FACH.HF).c:"transparent"}">${links}${rechts}</section>`;
}

/* ---------- Termine ---------- */
function monatHtml(y,m){
  const erster=new Date(y,m,1), tage=new Date(y,m+1,0).getDate(), off=(erster.getDay()+6)%7, h=iso(new Date());
  let z = ["Mo","Di","Mi","Do","Fr","Sa","So"].map(x=>`<i>${x}</i>`).join("") + "<span></span>".repeat(off);
  for(let d=1; d<=tage; d++){
    const k=iso(new Date(y,m,d)), ev=TERMINE.filter(t=>t.d===k);
    const cls=(k===h?" heute":"")+(k<h?" alt":"")+(ev.some(t=>t.art!=="u")?" ex":"");
    z += ev.length
      ? `<button type="button" class="mday fc${cls}" data-tday="${k}" style="${fcVar(ev[0].f)}" title="${esc(ev.map(t=>fName(t.f,true)+" "+t.t).join(" · "))}">${d}<u>${ev.slice(0,3).map(t=>`<s style="--d:${FACH[t.f].c}"></s>`).join("")}</u></button>`
      : `<span class="mday${cls}">${d}</span>`;
  }
  return `<div class="month"><h4>${MONL[m]} ${y}</h4><div class="mgridc">${z}</div></div>`;
}
function vTermine(){
  const h = iso(new Date()), f = S.tf||"Alle";
  let liste = TERMINE.filter(t => f==="Alle" || (f==="pa" ? t.art!=="u" : t.f===f));
  const alt = liste.filter(t=>t.d<h), neu = liste.filter(t=>t.d>=h);
  const zeigen = S.tAlt ? liste : neu;
  const start = new Date(), monate = [];
  for(let i=0;i<4;i++){ const d=new Date(start.getFullYear(), start.getMonth()+i, 1); monate.push(monatHtml(d.getFullYear(), d.getMonth())); }
  const faecher = [...new Set(TERMINE.filter(t=>t.d>=h).map(t=>t.f))];
  let html = "", woche = null, i = 0;
  while(i < zeigen.length){
    const t = zeigen[i], k = t.ts.getFullYear()+"-"+kw(t.ts);
    if(k!==woche){
      if(woche!==null) html += "</div>";
      woche = k;
      const mo = tag0(t.ts); mo.setDate(mo.getDate()-((mo.getDay()+6)%7)); const so=new Date(mo); so.setDate(so.getDate()+6);
      html += `<div class="week"><h3>KW ${kw(t.ts)} · ${mo.getDate()}.${mo.getMonth()+1}. bis ${so.getDate()}.${so.getMonth()+1}.${so.getFullYear()}</h3>`;
    }
    const tagEv = []; while(i<zeigen.length && zeigen[i].d===t.d){ tagEv.push(zeigen[i]); i++; }
    html += `<div class="trow${t.d===h?" heute":""}${t.d<h?" alt":""}" id="d-${t.d}">
      <div class="tdate"><span>${WT[t.ts.getDay()]}</span><b>${t.ts.getDate()}</b><span>${MON[t.ts.getMonth()]}</span></div>
      <div>${tagEv.map(e=>`<div class="tcard fc${e.art!=="u"?" ex":""}" style="${fcVar(e.f)}">
        <div class="tt">${esc(fName(e.f,true))} <em>${esc(e.t)}</em>${e.art==="p"?'<span class="bdg">Prüfung</span>':e.art==="a"?'<span class="bdg">Abgabe</span>':""}</div>
        <div class="tm">${zeit(e)}${e.art!=="a"&&e.f!=="HF"?" · "+ORT:""}</div>
        ${e.th?`<div class="tth">${esc(e.th)}</div>`:""}</div>`).join("")}</div></div>`;
  }
  if(woche!==null) html += "</div>";
  return `
  <div class="hero"><h1>Termine</h1><p>Unterricht, Prüfungen und Abgaben im 3. Semester. Zeiten und Zimmer stammen aus OpenOLAT, Stand ${STAND.split("-").reverse().join(".")}.</p></div>
  ${nowCard(false)}
  <div class="calbar">
    <div class="txt"><b>In deinen Kalender übernehmen</b>Das Abo aktualisiert sich selbst, wenn sich Termine ändern. Die Datei ist ein einmaliger Stand.</div>
    <a class="btn" href="webcal://${ICS_PFAD}">Kalender abonnieren</a>
    <button class="btn l" type="button" data-ics="copy">Abo-Link kopieren</button>
    <button class="btn l" type="button" data-ics="dl">.ics-Datei laden</button>
  </div>
  <div class="months">${monate.join("")}</div>
  <div class="chips">
    <button class="chip" type="button" data-tf="Alle" aria-pressed="${f==="Alle"}">Alle</button>
    <button class="chip" type="button" data-tf="pa" aria-pressed="${f==="pa"}">Prüfungen und Abgaben</button>
    ${faecher.map(x=>`<button class="chip" type="button" data-tf="${x}" aria-pressed="${f===x}">${esc(fName(x,true))}</button>`).join("")}
  </div>
  ${alt.length?`<p class="meta" style="margin:14px 0 0"><button class="lnk" type="button" data-talt="1">${S.tAlt?"Vergangene ausblenden":alt.length+" vergangene Termine anzeigen"}</button></p>`:""}
  ${html || `<div class="empty" style="margin-top:18px">Keine kommenden Termine in dieser Auswahl.</div>`}`;
}
function icsAktion(a){
  if(a==="copy"){
    const url="https://"+ICS_PFAD;

  S.tr={deck:key, tag:o.tag, nur:o.nur, mix:o.mix, q:k.map(c=>c.id), i:0, combo:0, runde:{g:0,u:0,n:0,xp:0}};
}

function qBewerte(v){

function klickNeu(b,d){
  if(d.tf){ S.tf=d.tf; render(); return true; }
  if(d.talt){ S.tAlt=!S.tAlt; render(); return true; }
  if(d.ics){ icsAktion(d.ics); return true; }
  if(d.tday){
    if(d.tday<iso(new Date()) && !S.tAlt){ S.tAlt=true; render(); }
    const el=document.getElementById("d-"+d.tday);
    if(el) el.scrollIntoView({behavior:"smooth", block:"start"}); else { S.tf="Alle"; render(); const e2=document.getElementById("d-"+d.tday); if(e2) e2.scrollIntoView({block:"start"}); }
    return true;
  }
  if(d.deck){ trStart(d.deck); go("trainer"); return true; }
  if(d.qtag){ trStart(S.tr.deck,{tag:d.qtag, nur:S.tr.nur, mix:S.tr.mix}); render(); return true; }
  if(d.qnur){ trStart(S.tr.deck,{tag:S.tr.tag, nur:!S.tr.nur, mix:S.tr.mix}); render(); return true; }
  if(d.qmix){ trStart(S.tr.deck,{tag:S.tr.tag, nur:S.tr.nur, mix:!S.tr.mix}); render(); return true; }
  if(d.qagain){ trStart(S.tr.deck,{tag:S.tr.tag, nur:d.qagain==="offen", mix:S.tr.mix}); render(); return true; }
  if(d.rate!=null){ qBewerte(Number(d.rate)); return true; }
  if(d.qnav){ qNav(Number(d.qnav)); return true; }
  if(b.id==="qflip"){ qDreh(); return true; }
  if(b.id==="qreset"){
    if(b.dataset.sicher){ DECKS[S.tr.deck].k.forEach(c=>{ delete S.stat[c.id]; }); store.saveLern(S.stat); trStart(S.tr.deck); render(); hinweis("Stapel zurückgesetzt."); }
    else { b.dataset.sicher="1"; b.textContent="Wirklich zurücksetzen? Nochmals antippen"; }
    return true; }
  return false;
}
document.addEventListener("keydown", ev=>{
  if(S.v!=="trainer" || S.q.trim().length>1 || /INPUT|TEXTAREA|SELECT/.test(ev.target.tagName) || ev.metaKey || ev.ctrlKey || ev.altKey) return;
  const k=document.getElementById("qcard"); if(!k) return;

});

/* ====================== SPIELSTAND: XP, LEVEL, SERIE, ABZEICHEN ====================== */
const ZIEL = 20;
const STUFEN = ["Starter","Lernling","Durchstarter","Könner","Profi","Champion","Legende"];
function gData(){
  let g = S.stat._g;
  if(!g || typeof g!=="object"){ g = {xp:0, tage:{}, best:0, total:0, abz:[], combo:0}; S.stat._g = g; }
  if(!g.tage) g.tage = {}; if(!g.abz) g.abz = [];
  return g;
}
const lvlVon = xp => Math.floor(Math.sqrt(xp/100))+1;
const lvlStart = l => 100*(l-1)*(l-1);
const stufe = l => STUFEN[Math.min(l, STUFEN.length)-1];
function serie(g){
  let n=0; const d=tag0(new Date());
  if(!g.tage[iso(d)]) d.setDate(d.getDate()-1);
  while(g.tage[iso(d)]){ n++; d.setDate(d.getDate()-1); }
  return n;
}
const ABZEICHEN = [
  {id:"start", e:"🚀", n:"Erste Karte", d:"Die erste Karte bewertet", ok:g=>g.total>=1},
  {id:"ziel", e:"🎯", n:"Tagesziel", d:ZIEL+" Karten an einem Tag", ok:g=>Object.values(g.tage).some(x=>x>=ZIEL)},
  {id:"s3", e:"🔥", n:"3 Tage in Serie", d:"Drei Tage hintereinander gelernt", ok:g=>g.best>=3},
  {id:"s7", e:"⚡", n:"Wochenserie", d:"Sieben Tage hintereinander gelernt", ok:g=>g.best>=7},
  {id:"c5", e:"🎳", n:"5er-Combo", d:"Fünfmal hintereinander gewusst", ok:g=>g.combo>=5},
  {id:"c10", e:"💎", n:"10er-Combo", d:"Zehnmal hintereinander gewusst", ok:g=>g.combo>=10},
  {id:"h100", e:"💯", n:"100 Karten", d:"100 Karten bewertet", ok:g=>g.total>=100},
  {id:"halb", e:"🌗", n:"Halbzeit", d:"Einen Stapel zur Hälfte gewusst", ok:()=>Object.keys(DECKS).some(k=>{ const s=deckStand(k); return s.g*2>=s.t; })},
  {id:"infw", e:"🧠", n:"INFW gemeistert", d:"Alle INFW-Karten gewusst", ok:()=>{ const s=deckStand("infw"); return s.g===s.t; }},
  {id:"lead", e:"🧭", n:"Leadership gemeistert", d:"Alle Leadership-Karten gewusst", ok:()=>{ const s=deckStand("lead"); return s.g===s.t; }},
  {id:"cm", e:"🦋", n:"Change gemeistert", d:"Alle Change-Karten gewusst", ok:()=>{ const s=deckStand("cm"); return s.g===s.t; }}
];
function gRing(anteil, gross, klein){
  const r=45, u=2*Math.PI*r;
  return `<div class="g-ring"><svg viewBox="0 0 104 104" aria-hidden="true"><circle class="bg" cx="52" cy="52" r="${r}"/><circle class="fg" cx="52" cy="52" r="${r}" stroke-dasharray="${u.toFixed(1)}" stroke-dashoffset="${(u*(1-Math.max(0,Math.min(1,anteil)))).toFixed(1)}"/></svg><div><small>${klein}</small><b>${gross}</b></div></div>`;
}
function gameCard(){
  const g=gData(), l=lvlVon(g.xp), a=lvlStart(l), b=lvlStart(l+1), ant=(g.xp-a)/(b-a), heute=g.tage[iso(new Date())]||0, s=serie(g);

function hudHtml(){
  const g=gData(), T=S.tr, heute=g.tage[iso(new Date())]||0;
  return `<div class="hud"><span>Level ${lvlVon(g.xp)} · ${g.xp} XP</span><span>🔥 ${serie(g)}</span><span>🎯 ${Math.min(heute,ZIEL)}/${ZIEL} heute</span>${T&&T.combo>=2?`<span class="combo">Combo ×${T.combo}</span>`:""}</div>`;

  const g=gData(), l=lvlVon(g.xp);
  el.innerHTML=`<b>${l}</b><span>${g.xp} XP</span>`; el.setAttribute("aria-label","Level "+l+", "+g.xp+" XP. Zum Spielstand");
}
function xpPop(txt){
  const el=document.createElement("div"); el.className="xp-pop"; el.textContent=txt; document.body.appendChild(el); setTimeout(()=>el.remove(), 1000);
}
function konfetti(menge){
  if(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  let c=document.getElementById("konfetti");
  if(!c){ c=document.createElement("canvas"); c.id="konfetti"; document.body.appendChild(c); }
  const x=c.getContext("2d"), W=c.width=innerWidth, H=c.height=innerHeight, F=["#0A84FF","#AF52DE","#FF2D55","#FF9F0A","#30D158","#FFD60A","#64D2FF"];
  const P=Array.from({length:menge||130},()=>({x:W/2+(Math.random()-.5)*W*.3, y:H*.42, vx:(Math.random()-.5)*15, vy:-Math.random()*15-5, g:.36+Math.random()*.16, s:6+Math.random()*7, r:Math.random()*6.3, vr:(Math.random()-.5)*.4, f:F[Math.floor(Math.random()*F.length)], k:Math.random()<.5}));
  const t0=performance.now(); cancelAnimationFrame(konfetti.raf);
  (function zeichne(t){
    const d=t-t0; x.clearRect(0,0,W,H);
    P.forEach(p=>{ p.vy+=p.g; p.x+=p.vx; p.y+=p.vy; p.vx*=.99; p.r+=p.vr;
      x.save(); x.translate(p.x,p.y); x.rotate(p.r); x.globalAlpha=Math.max(0,1-d/2300); x.fillStyle=p.f;
      if(p.k){ x.beginPath(); x.arc(0,0,p.s/2,0,6.3); x.fill(); } else x.fillRect(-p.s/2,-p.s/3,p.s,p.s*.66);
      x.restore(); });
    if(d<2300) konfetti.raf=requestAnimationFrame(zeichne); else x.clearRect(0,0,W,H);
  })(t0);
}
/* Punkte für eine bewertete Karte. Gibt den Text für die Einblendung zurück. */
function gBewerte(v, warSchonGewusst, rundeFertig){
  const g=gData(), T=S.tr, vorher=lvlVon(g.xp), h=iso(new Date());
  T.combo = v===1 ? (T.combo||0)+1 : 0;
  let xp = v===1?10 : v===-1?5 : 2;
  if(v===1){ xp += Math.min(T.combo-1,5)*2; if(!warSchonGewusst) xp += 5; }
  if(rundeFertig) xp += 25;
  g.xp += xp; g.total++; g.tage[h]=(g.tage[h]||0)+1; g.combo=Math.max(g.combo||0, T.combo); g.best=Math.max(g.best||0, serie(g));
  T.runde.xp=(T.runde.xp||0)+xp;
  const neu=ABZEICHEN.filter(z=>!g.abz.includes(z.id) && z.ok(g)); neu.forEach(z=>g.abz.push(z.id));
  const nachher=lvlVon(g.xp);
  if(nachher>vorher){ konfetti(170); hinweis("Level "+nachher+" erreicht: "+stufe(nachher)); }
  else if(neu.length){ konfetti(110); hinweis("Abzeichen freigeschaltet: "+neu.map(z=>z.e+" "+z.n).join(", ")); }
  else if(rundeFertig) konfetti(120);
  else if((g.tage[h]||0)===ZIEL){ konfetti(110); hinweis("Tagesziel erreicht: "+ZIEL+" Karten"); }
  return "+"+xp+" XP"+(v===1&&T.combo>=3?" · Combo ×"+T.combo:"");
}

/* ====================== RENDER ====================== */
function render(){
  lvlChip();
  const v = view();
  v.classList.toggle("wide", S.v==="netz" && S.q.trim().length<2);
  if(S.q.trim().length>1){ v.innerHTML = vSuche(); return; }
  switch(S.v){
    case "methoden": v.innerHTML = vMethoden(); break;
    case "methode":  v.innerHTML = vMethode(); { const t=toolById(S.id); if(t&&t.calc) mountCalc(t.calc); } break;
    case "netz":     v.innerHTML = vNetz(); bindNetz(); break;
    case "projekte": v.innerHTML = vProjekte(); break;
    case "projekt":  v.innerHTML = vProjekt(); bindForm(); break;
    case "termine":  v.innerHTML = vTermine(); break;
    case "pruefungen": v.innerHTML = vPruef(); break;
    case "trainer":  if(!S.tr) trStart("infw"); v.innerHTML = vTrainer(); break;
    case "probe":    v.innerHTML = vProbe(); break;
    case "lernen":   v.innerHTML = vLernen(); { const s=document.getElementById("lernmod"); if(s) s.onchange = e=>{ S.lernMod=e.target.value; S.li=0; S.auf=false; render(); }; } break;
    default:         v.innerHTML = vUebersicht();
  }
}

document.addEventListener("click", ev=>{
  const b = ev.target.closest("button");
  if(!b){ if(ev.target.closest("#qcard")){ qDreh(); return; } if(ev.target.closest("#flash") && !S.auf){ S.auf=true; render(); } return; }
  const d = b.dataset;
  if(klickNeu(b,d)) return;
  if(d.gonetz){ NZ.map=d.gonetz; go("netz"); return; }
  if(d.go){ S.entwurf=null; if(d.go==="methoden"){ S.mod=null; } go(d.go); return; }
  if(d.mod){ S.mod=d.mod; S.kat="Alle"; go("methoden"); return; }
  if(d.clearmod){ S.mod=null; render(); return; }
  if(d.tool){ go("methode", d.tool); return; }
  if(d.projekt){ S.entwurf=null; go("projekt", d.projekt); return; }
  if(d.neu!=null){ S.entwurf=null; S.vorTool = d.neu!=="1"?d.neu:null; go("projekt","neu"); return; }
  if(d.kat){ S.kat=d.kat; render(); return; }
  if(d.netz){ NZ.map=d.netz; document.querySelectorAll("[data-netz]").forEach(x=>x.setAttribute("aria-selected", x.dataset.netz===d.netz)); const q=document.getElementById("nzq"); if(q) q.value=""; mountNetz(); return; }
  if(d.nzsel!=null){ waehle(d.nzsel||null, true); return; }
  if(d.pick){
    syncForm();
    const a = S.entwurf.tools || (S.entwurf.tools=[]);
    const i = a.indexOf(d.pick); if(i>=0) a.splice(i,1); else a.push(d.pick);
    document.getElementById("picked").innerHTML = pickedHtml();
    document.getElementById("plist").innerHTML = plistHtml();
    return;
  }
  if(d.bew!=null){ const c=S.karten[S.li]; if(c){ S.stat[c.id]= d.bew==="1"?1:0; store.saveLern(S.stat);} S.li=(S.li+1)%Math.max(1,S.karten.length); S.auf=false; render(); return; }
  if(d.skip){ S.li=(S.li+1)%Math.max(1,S.karten.length); S.auf=false; render(); return; }
  if(b.id==="flip"){ S.auf=true; render(); return; }
  if(b.id==="reset"){ if(confirm("Lernfortschritt der Methodenkarten zurücksetzen?")){ Object.keys(S.stat).forEach(k=>{ if(/^(t|m)-/.test(k)) delete S.stat[k]; }); store.saveLern(S.stat); render(); } return; }
  if(b.id==="themeBtn"){
    const dunkelJetzt = getComputedStyle(document.documentElement).getPropertyValue("--mode").trim()==="dark";
    const neu = dunkelJetzt ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", neu);
    try{ localStorage.setItem("hfwi-theme", neu); }catch(e){}
  }
});
document.getElementById("q").addEventListener("input", e=>{ S.q=e.target.value; render(); });

(async function(){
  try{ const th=localStorage.getItem("hfwi-theme"); if(th) document.documentElement.setAttribute("data-theme", th); }catch(e){}
  renderNav(); render();
  await store.init();
  S.projekte = await store.projekte();
  S.stat = await store.lern();
  render();
})();
</script>
