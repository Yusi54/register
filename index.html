<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Register HFWI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Archivo:wght@400;500;600;700;800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#16212B; --soft:#56646F; --bg:#F2F4F1; --card:#FFFFFF; --line:#DCE1DC;
  --s1:#12565C; --s1t:#E3F0EF;
  --s2:#6B2D5C; --s2t:#F3E6EF;
  --s3:#8A5A0F; --s3t:#F6EEDD;
  --acc:#12565C; --ok:#2F6B3A;
  --r:14px; --rs:9px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#E8ECE8; --soft:#9CA8AA; --bg:#0F1416; --card:#182022; --line:#2A3437;
    --s1:#6CC0C4; --s1t:#15302F; --s2:#D69CC4; --s2t:#2E1C29; --s3:#E0B35F; --s3t:#2E2513;
    --acc:#6CC0C4; --ok:#86C592;
  }
}
:root[data-theme="dark"]{
  --ink:#E8ECE8; --soft:#9CA8AA; --bg:#0F1416; --card:#182022; --line:#2A3437;
  --s1:#6CC0C4; --s1t:#15302F; --s2:#D69CC4; --s2t:#2E1C29; --s3:#E0B35F; --s3t:#2E2513;
  --acc:#6CC0C4; --ok:#86C592;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px); -webkit-text-size-adjust:100%}
body{margin:0; background:var(--bg); color:var(--ink); font-family:Archivo,'Segoe UI',system-ui,sans-serif; font-size:15.5px; line-height:1.5}
h1,h2,h3,h4{margin:0; line-height:1.15; letter-spacing:-0.015em}
p{margin:0 0 .6em}
button{font:inherit; color:inherit}

/* Kopf */
.top{position:sticky; top:0; z-index:30; background:var(--bg); border-bottom:1px solid var(--line); padding-top:env(safe-area-inset-top,0px)}
.topin{max-width:1060px; margin:0 auto; padding:12px 22px; display:flex; align-items:center; gap:18px}
.logo{font-weight:800; font-size:18px; letter-spacing:-0.03em; white-space:nowrap; background:none; border:0; cursor:pointer; padding:0}
.logo span{color:var(--acc)}
.tabs{display:flex; gap:4px; flex:1}
.tabs button{background:none; border:0; padding:8px 13px; border-radius:99px; cursor:pointer; color:var(--soft); font-weight:500; white-space:nowrap}
.tabs button:hover{color:var(--ink); background:var(--card)}
.tabs button[aria-current="true"]{background:var(--ink); color:var(--bg)}
.tools-r{display:flex; gap:8px; align-items:center}
.srch{background:var(--card); border:1px solid var(--line); border-radius:99px; padding:7px 14px; font:inherit; color:var(--ink); width:200px}
.top .srch{width:200px; padding:7px 14px; border-radius:99px; background:var(--card)}
.icon{background:var(--card); border:1px solid var(--line); border-radius:99px; width:36px; height:36px; cursor:pointer; font-size:15px}
.wrap{max-width:1060px; margin:0 auto; padding:30px 22px 60px}

/* Kopftext der Seiten */
.hero{margin-bottom:26px}
.hero h1{font-size:clamp(28px,4vw,40px); font-weight:800}
.hero p{color:var(--soft); margin-top:8px; max-width:56ch; font-size:16px}

/* Studienweg */
.weg{display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-bottom:30px}
.sem{border-radius:var(--r); padding:18px 16px 16px; background:var(--card); border:1px solid var(--line); position:relative; overflow:hidden}
.sem::before{content:""; position:absolute; left:0; top:0; right:0; height:5px; background:var(--c)}
.sem h2{font-size:15px; font-weight:700; color:var(--c); margin-bottom:2px}
.sem .jahr{font-size:13px; color:var(--soft); margin-bottom:12px}
.mod{display:flex; align-items:center; gap:10px; width:100%; text-align:left; border:0; background:var(--t); border-radius:var(--rs); padding:10px 12px; margin-bottom:7px; cursor:pointer}
.mod:hover{outline:2px solid var(--c)}
.mod b{font-weight:600; font-size:14.5px; flex:1}
.mod i{font-style:normal; font-size:12px; color:var(--soft); white-space:nowrap}

.row2{display:grid; grid-template-columns:1.3fr 1fr; gap:14px}
.box{background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:20px}
.box h3{font-size:16px; font-weight:700; margin-bottom:12px}
.nums{display:flex; gap:26px; flex-wrap:wrap; margin-bottom:28px}
.nums div b{display:block; font-size:30px; font-weight:800; line-height:1}
.nums div span{font-size:13px; color:var(--soft)}

/* Listen */
.item{display:flex; align-items:center; gap:12px; width:100%; text-align:left; background:none; border:0; border-top:1px solid var(--line); padding:12px 2px; cursor:pointer}
.item:first-child{border-top:0}
.item:hover b{color:var(--acc)}
.item b{font-weight:600; flex:1}
.item small{color:var(--soft); font-size:12.5px; display:block; font-weight:400}
.dot{width:9px; height:9px; border-radius:50%; background:var(--c,var(--soft)); flex:none}
.pill{font-size:12px; padding:3px 10px; border-radius:99px; background:var(--bg); color:var(--soft); white-space:nowrap}
.pill.Laufend{background:var(--s1t); color:var(--s1)} .pill.Fertig{color:var(--ok)} .pill.Idee{background:var(--s2t); color:var(--s2)} .pill.Offen{background:var(--s3t); color:var(--s3)}

/* Chips */
.chips{display:flex; flex-wrap:wrap; gap:7px}
.chip{background:var(--card); border:1px solid var(--line); border-radius:99px; padding:6px 13px; font-size:13.5px; cursor:pointer; color:var(--ink)}
.chip:hover{border-color:var(--acc)}
.chip[aria-pressed="true"]{background:var(--ink); border-color:var(--ink); color:var(--bg)}
.chip.x::after{content:"  ✕"; opacity:.6}

/* Methoden */
.mgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:12px; margin-top:18px}
.mcard{background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:16px 16px 14px; text-align:left; cursor:pointer; display:flex; flex-direction:column; gap:6px}
.mcard:hover{border-color:var(--c,var(--acc)); transform:translateY(-1px)}
.mcard h4{font-size:16px; font-weight:700}
.mcard p{font-size:13.5px; color:var(--soft); margin:0; flex:1}
.mcard .ft{display:flex; justify-content:space-between; align-items:center; font-size:12px; color:var(--soft); margin-top:6px}
.mcard .rk{color:var(--acc); font-weight:600}
.bar{display:flex; gap:10px; align-items:center; flex-wrap:wrap}

/* Detail */
.back{background:none; border:0; color:var(--soft); cursor:pointer; padding:0; margin-bottom:16px; font-size:14px}
.back:hover{color:var(--ink)}
.det{display:grid; grid-template-columns:1fr 300px; gap:16px; align-items:start}
.serif{font-family:'Source Serif 4',Georgia,serif; font-size:16.5px; line-height:1.62}
.steps{list-style:none; margin:0; padding:0; counter-reset:s}
.steps li{counter-increment:s; display:flex; gap:12px; padding:10px 0; border-top:1px solid var(--line)}
.steps li:first-child{border-top:0}
.steps li::before{content:counter(s); flex:none; width:24px; height:24px; border-radius:50%; background:var(--bg); color:var(--soft); font-size:12px; font-weight:700; display:grid; place-items:center; font-family:Archivo,sans-serif}
.side .box{margin-bottom:14px}
.side h3{font-size:13.5px; color:var(--soft); font-weight:600; margin-bottom:9px}
.diag{width:100%; height:auto; display:block; overflow:visible}
.herkunft b{display:block; font-size:16px; margin-bottom:2px}
.herkunft p{margin:0}

/* Formular */
label{display:block; font-size:13px; color:var(--soft); margin:14px 0 5px; font-weight:500}
input[type=text],input[type=number],select,textarea,input[type=search]{
  width:100%; background:var(--bg); border:1px solid var(--line); border-radius:var(--rs); padding:9px 12px; font:inherit; color:var(--ink)}
textarea{min-height:80px; resize:vertical; font-family:'Source Serif 4',Georgia,serif; font-size:15.5px}
.f3{display:grid; grid-template-columns:repeat(3,1fr); gap:12px}
.btn{background:var(--ink); color:var(--bg); border:0; border-radius:99px; padding:10px 20px; cursor:pointer; font-weight:600}
.btn:hover{opacity:.88}
.btn.l{background:none; color:var(--soft); border:1px solid var(--line)}
.btn.l:hover{color:var(--ink); opacity:1}
.btn.d{background:none; color:var(--s2); border:1px solid var(--line)}
.acts{display:flex; gap:10px; flex-wrap:wrap; margin-top:20px}
.picked{min-height:32px; margin-bottom:10px}
.plist{max-height:230px; overflow-y:auto; border:1px solid var(--line); border-radius:var(--rs); padding:8px}
.plist .chip{margin:3px}

table{width:100%; border-collapse:collapse; font-size:14px}
th,td{text-align:left; padding:7px 4px; border-bottom:1px solid var(--line)}
th{font-weight:500; color:var(--soft)}
td.n{text-align:right; font-variant-numeric:tabular-nums}
.ovf{overflow-x:auto}

/* Karteikarten */
.flash{background:var(--card); border:1px solid var(--line); border-radius:20px; min-height:260px; padding:34px 28px; cursor:pointer; display:flex; flex-direction:column; justify-content:center; text-align:center; position:relative; overflow:hidden}
.flash::before{content:""; position:absolute; left:0; top:0; bottom:0; width:6px; background:var(--c,var(--acc))}
.flash .q{font-size:22px; font-weight:700; max-width:34ch; margin:0 auto}
.flash .a{font-family:'Source Serif 4',Georgia,serif; font-size:16px; line-height:1.65; text-align:left; max-width:54ch; margin:18px auto 0; padding-top:18px; border-top:1px solid var(--line)}
.flash .h{font-size:13px; color:var(--soft); margin-top:16px}
.prog{height:6px; background:var(--line); border-radius:99px; overflow:hidden; margin:16px 0 8px}
.prog i{display:block; height:100%; background:var(--acc); border-radius:99px}

.empty{border:1.5px dashed var(--line); border-radius:var(--r); padding:30px; text-align:center; color:var(--soft)}
.meta{font-size:13px; color:var(--soft)}
:focus-visible{outline:2px solid var(--acc); outline-offset:2px}

@media (max-width:860px){
  .weg{grid-template-columns:1fr}
  .row2,.det{grid-template-columns:1fr}
  .top .srch{width:160px}
}
@media (max-width:640px){
  .topin{flex-wrap:wrap; gap:10px; padding:10px 16px}
  .tabs{order:3; flex:0 0 100%; overflow-x:auto; scrollbar-width:none}
  .tabs button{padding:7px 11px}
  .logo{flex:1; text-align:left}
  .tools-r{margin-left:auto}
  .top .srch{width:130px}
  .wrap{padding:22px 16px 50px}
  .f3{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.mcard{transition:transform .12s, border-color .12s}
.grid{display:grid; gap:12px}
.g3{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.row{display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-top:14px}
.btn.sec{background:none; color:var(--soft); border:1px solid var(--line)}

/* Wissensnetz */
.seg{display:inline-flex; background:var(--card); border:1px solid var(--line); border-radius:99px; padding:3px; gap:2px; flex-wrap:wrap}
.seg button{background:none; border:0; border-radius:99px; padding:7px 14px; cursor:pointer; color:var(--soft); font-weight:500}
.seg button[aria-selected="true"]{background:var(--ink); color:var(--bg)}
.netzwrap{display:grid; grid-template-columns:1fr 310px; gap:14px; margin-top:16px; align-items:start}
.netz{background:var(--card); border:1px solid var(--line); border-radius:var(--r); height:min(84vh,900px); min-height:460px; overflow:hidden; touch-action:none}
.nzpanel{position:sticky; top:84px; max-height:min(84vh,900px); overflow-y:auto}
.wrap.wide{max-width:1440px}
.netz .web circle{fill:none; stroke:var(--line); stroke-width:1}
.netz .web line{stroke:var(--line); stroke-width:1; stroke-dasharray:2 4}
.netz .lk{stroke:var(--soft); stroke-opacity:.35; stroke-width:1.2}
.netz .lk.quer{stroke-dasharray:4 4; stroke-opacity:.45}
.netz .lk.on{stroke:var(--ink); stroke-opacity:.9; stroke-width:2}
.netz .lk.dim{stroke-opacity:.06}
.netz .nd text.lb{font:500 13px Archivo,sans-serif; fill:var(--ink); paint-order:stroke; stroke:var(--card); stroke-width:3.5px; stroke-linejoin:round; pointer-events:none}
.netz .nd.bereich text.lb{font-weight:700; font-size:14px}
.netz .nd.root text.lb{font-weight:800; font-size:18px}
.netz .nd.root text.lbr{font-size:10px; text-anchor:middle; pointer-events:none}
.netz .nd{transition:opacity .15s}
.netz .nd.dim{opacity:.18}
.netz .nd.on circle,.netz .nd.hit circle{stroke:var(--ink); stroke-width:3}
.netz .nd:focus{outline:none}
.netz .nd:focus-visible circle{stroke:var(--acc); stroke-width:3.5}
@media (max-width:860px){
  .seg{flex-wrap:nowrap; overflow-x:auto; max-width:100%}
  .seg button{padding:7px 11px; white-space:nowrap}
  #nzq{width:100% !important}
  .netzwrap{grid-template-columns:1fr}
  .nzpanel{position:static; max-height:none}
  .netz{height:62vh; min-height:400px}
}

/* ====================== TERMINE, PRÜFUNGEN, TRAINER ====================== */
[hidden]{display:none!important}
.top{background:color-mix(in srgb,var(--bg) 80%,transparent); -webkit-backdrop-filter:saturate(1.4) blur(14px); backdrop-filter:saturate(1.4) blur(14px)}
.tabs{overflow-x:auto; scrollbar-width:none; min-width:0}
.tabs::-webkit-scrollbar{display:none}
.top .srch{width:150px}
.fc{--fct:color-mix(in srgb,var(--fc) 13%,var(--card)); --fci:color-mix(in srgb,var(--fc) 72%,var(--ink))}
.kicker{font-size:12px; font-weight:700; letter-spacing:.09em; text-transform:uppercase; color:var(--fci,var(--soft)); display:flex; align-items:center; gap:8px}
.sech{font-size:20px; font-weight:800; margin:34px 0 14px}
.sech small{font-weight:400; color:var(--soft); font-size:14px; margin-left:8px}

/* Als Nächstes */
.now{position:relative; overflow:hidden; display:grid; grid-template-columns:1fr auto; gap:22px; align-items:center; border-radius:24px; padding:26px 28px; margin-bottom:26px; border:1px solid color-mix(in srgb,var(--fc) 30%,var(--line)); background:
  radial-gradient(120% 140% at 0% 0%, color-mix(in srgb,var(--fc) 26%,transparent), transparent 58%),
  radial-gradient(90% 120% at 100% 100%, color-mix(in srgb,var(--fc2,var(--fc)) 22%,transparent), transparent 60%),
  var(--card)}
.now::after{content:""; position:absolute; right:-70px; top:-90px; width:260px; height:260px; border-radius:50%; background:color-mix(in srgb,var(--fc) 20%,transparent); filter:blur(46px); pointer-events:none; animation:drift 14s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate(-50px,40px) scale(1.15)}}
.now>*{position:relative; z-index:1}
.now h2{font-size:clamp(24px,3.4vw,34px); font-weight:800; margin:8px 0 6px}
.now h2 span{color:var(--fci); font-weight:700}
.now .now-m{font-weight:600; font-variant-numeric:tabular-nums}
.now p{color:var(--soft); margin:8px 0 0; max-width:60ch}
.now .acts{margin-top:16px}
.live{width:9px; height:9px; border-radius:50%; background:#E5484D; box-shadow:0 0 0 0 rgba(229,72,77,.6); animation:pulse 1.6s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 9px rgba(229,72,77,0)} 100%{box-shadow:0 0 0 0 rgba(229,72,77,0)}}
.now-ex{display:flex; align-items:center; gap:14px; text-align:left; background:color-mix(in srgb,var(--card) 70%,transparent); border:1px solid var(--line); border-radius:18px; padding:14px 18px 14px 14px; cursor:pointer; max-width:300px}
.now-ex:hover{border-color:var(--fci)}
.now-ex b{display:block; font-size:15px; line-height:1.25}
.now-ex small{color:var(--soft); font-size:12.5px}

/* Countdown-Ring */
.ring{position:relative; width:76px; height:76px; flex:none}
.ring svg{width:100%; height:100%; transform:rotate(-90deg)}
.ring circle{fill:none; stroke-width:7}
.ring .bg{stroke:color-mix(in srgb,var(--fc) 16%,var(--line))}
.ring .fg{stroke:var(--fci); stroke-linecap:round; transition:stroke-dashoffset .8s cubic-bezier(.2,.8,.2,1)}
.ring div{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; line-height:1}
.ring b{font-size:22px; font-weight:800; font-variant-numeric:tabular-nums}
.ring span{font-size:10.5px; color:var(--soft); margin-top:3px; letter-spacing:.04em; text-transform:uppercase}

/* Kalenderleiste */
.calbar{display:flex; flex-wrap:wrap; gap:10px; align-items:center; background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:14px 16px; margin-bottom:18px}
.calbar .txt{flex:1 1 260px; font-size:13.5px; color:var(--soft)}
.calbar .txt b{color:var(--ink); display:block; font-size:15px}
a.btn{text-decoration:none; display:inline-block}
.months{display:flex; gap:12px; overflow-x:auto; padding-bottom:6px; margin-bottom:18px; scrollbar-width:thin}
.month{flex:0 0 232px; background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:14px}
.month h4{font-size:14px; margin-bottom:10px}
.mgridc{display:grid; grid-template-columns:repeat(7,1fr); gap:2px; font-size:11.5px; text-align:center}
.mgridc i{font-style:normal; color:var(--soft); padding-bottom:4px}
.mday{position:relative; aspect-ratio:1; display:flex; align-items:center; justify-content:center; border-radius:8px; border:0; background:none; padding:0; color:var(--soft); font-variant-numeric:tabular-nums}
button.mday{cursor:pointer; color:var(--ink); font-weight:700; background:color-mix(in srgb,var(--fc) 15%,transparent)}
button.mday:hover{background:color-mix(in srgb,var(--fc) 30%,transparent)}
.mday.ex{outline:2px solid var(--fci); outline-offset:-2px}
.mday.heute{box-shadow:inset 0 0 0 2px var(--ink)}
.mday.alt{opacity:.45}
.mday u{position:absolute; bottom:3px; left:50%; transform:translateX(-50%); display:flex; gap:2px; text-decoration:none}
.mday u s{width:4px; height:4px; border-radius:50%; background:var(--d)}

/* Agenda */
.week{margin-top:22px}
.week>h3{font-size:12.5px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--soft); margin-bottom:8px; display:flex; gap:10px; align-items:center}
.week>h3::after{content:""; flex:1; height:1px; background:var(--line)}
.trow{display:grid; grid-template-columns:62px 1fr; gap:14px; align-items:stretch; margin-bottom:8px; scroll-margin-top:90px}
.tdate{display:flex; flex-direction:column; align-items:center; justify-content:center; border-radius:14px; background:var(--card); border:1px solid var(--line); padding:8px 0; line-height:1.1}
.tdate span{font-size:11.5px; color:var(--soft); text-transform:uppercase; letter-spacing:.05em}
.tdate b{font-size:22px; font-weight:800; font-variant-numeric:tabular-nums}
.trow.heute .tdate{background:var(--ink); border-color:var(--ink); color:var(--bg)}
.trow.heute .tdate span{color:inherit; opacity:.75}
.tcard{position:relative; background:var(--fct); border-radius:14px; padding:12px 16px 12px 20px; border:1px solid color-mix(in srgb,var(--fc) 22%,var(--line))}
.tcard::before{content:""; position:absolute; left:7px; top:10px; bottom:10px; width:4px; border-radius:4px; background:var(--fci)}
.tcard+.tcard{margin-top:6px}
.tcard .tt{font-weight:700; display:flex; flex-wrap:wrap; gap:6px 10px; align-items:center}
.tcard .tt em{font-style:normal; font-weight:500; color:var(--fci)}
.tcard .tm{font-size:13.5px; color:var(--soft); font-variant-numeric:tabular-nums; margin-top:2px}
.tcard .tth{font-size:14px; margin-top:6px}
.trow.alt{opacity:.55}
.bdg{font-size:11px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; padding:2px 8px; border-radius:99px; background:var(--fci); color:var(--card)}
.bdg.l{background:none; color:var(--fci); border:1px solid currentColor}
.tcard.ex{background:color-mix(in srgb,var(--fc) 22%,var(--card)); border-color:var(--fci)}

/* Prüfungen */
.pgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(310px,1fr)); gap:14px}
.pcard{background:var(--card); border:1px solid var(--line); border-radius:20px; padding:20px; display:flex; flex-direction:column; gap:12px; position:relative; overflow:hidden; transition:transform .15s, border-color .15s, box-shadow .15s}
.pcard::before{content:""; position:absolute; inset:0 0 auto 0; height:5px; background:linear-gradient(90deg,var(--fci),color-mix(in srgb,var(--fc) 40%,transparent))}
.pcard:hover{transform:translateY(-3px); border-color:color-mix(in srgb,var(--fc) 45%,var(--line)); box-shadow:0 14px 34px -18px color-mix(in srgb,var(--fc) 55%,transparent)}
.pcard.vorbei{opacity:.55}
.phead{display:flex; gap:14px; align-items:center}

.facts li{display:grid; grid-template-columns:92px 1fr; gap:8px}

.pcard details{border-top:1px solid var(--line); padding-top:10px; font-size:14px}
.pcard summary{cursor:pointer; font-weight:600; list-style:none; display:flex; justify-content:space-between}
.pcard summary::after{content:"+"; color:var(--soft); font-weight:400}
.pcard details[open] summary::after{content:"–"}
.pcard details ul,.pcard details ol{margin:8px 0 0; padding-left:20px}
.pcard details li{margin:3px 0}
.pcard .acts{margin-top:auto; padding-top:4px}
.dtile{display:flex; flex-direction:column; gap:8px; text-align:left; background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:16px; cursor:pointer; transition:transform .15s, border-color .15s}

.dtile b{font-size:16px}
.dtile small{color:var(--soft)}
.pseg{display:flex; height:10px; border-radius:99px; overflow:hidden; background:var(--line)}

.legend{display:flex; flex-wrap:wrap; gap:6px 16px; font-size:13px; color:var(--soft); margin:8px 0 18px}
.legend span::before{content:""; display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:6px; background:var(--k)}

/* Karteikarten-Trainer */
.tr{max-width:760px; margin:0 auto}
.qcard{perspective:1600px; cursor:pointer; margin-top:6px; outline:none}
.qin{display:grid; transition:transform .55s cubic-bezier(.2,.75,.2,1); transform-style:preserve-3d}
.qcard.is-flipped .qin{transform:rotateY(180deg)}
.face{grid-area:1/1; -webkit-backface-visibility:hidden; backface-visibility:hidden; min-height:300px; border-radius:26px; padding:34px 30px 30px; display:flex; flex-direction:column; border:1px solid color-mix(in srgb,var(--fc) 28%,var(--line)); box-shadow:0 26px 50px -30px color-mix(in srgb,var(--fc) 60%,transparent); background:
  radial-gradient(110% 90% at 100% 0%, color-mix(in srgb,var(--fc) 18%,transparent), transparent 60%), var(--card)}
.face.qb{transform:rotateY(180deg); background:radial-gradient(110% 90% at 0% 0%, color-mix(in srgb,var(--fc) 14%,transparent), transparent 60%), var(--card)}
.qtag{align-self:flex-start; font-size:11.5px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--fci); background:var(--fct); padding:4px 10px; border-radius:99px}
.qq{font-size:clamp(20px,3vw,27px); font-weight:800; line-height:1.25; letter-spacing:-0.015em; margin:auto 0; padding:22px 0; text-wrap:balance}
.qh{font-size:13px; color:var(--soft)}
.qa{font-family:'Source Serif 4',Georgia,serif; font-size:17px; line-height:1.65; margin:auto 0; padding:18px 0 4px}
.qa b{font-family:Archivo,sans-serif; font-weight:700; font-size:.95em}
.rate{display:grid; grid-template-columns:repeat(3,1fr); gap:10px}
.rate button{border-radius:16px; padding:13px 8px; font-weight:700; border:1px solid var(--line); background:var(--card); cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:3px; transition:transform .1s}
.rate button:active{transform:scale(.97)}
.rate button small{font-weight:400; color:var(--soft); font-size:11.5px}
.rate .r0{border-color:#D4583F; color:#D4583F} .rate .r1{border-color:#D9A21B; color:#B58512} .rate .r2{border-color:var(--ok); color:var(--ok)}
.rate .r0:hover{background:color-mix(in srgb,#D4583F 12%,var(--card))} .rate .r1:hover{background:color-mix(in srgb,#D9A21B 14%,var(--card))} .rate .r2:hover{background:color-mix(in srgb,var(--ok) 12%,var(--card))}
kbd{font:inherit; font-size:11px; border:1px solid var(--line); border-radius:5px; padding:0 5px; color:var(--soft)}
.trbar{display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; font-size:13.5px; color:var(--soft); margin:14px 0 4px}
.lnk{background:none; border:0; padding:0; color:var(--soft); text-decoration:underline; cursor:pointer; font-size:13.5px}
.lnk:hover{color:var(--ink)}
.fertig{text-align:center; border-radius:26px; padding:44px 26px; background:radial-gradient(120% 100% at 50% 0%, color-mix(in srgb,var(--fc) 20%,transparent), transparent 62%), var(--card); border:1px solid var(--line)}
.fertig h2{font-size:28px; font-weight:800; margin-bottom:8px}
.fertig .acts{justify-content:center}

/* Probeprüfung */
.bridges{display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:10px}
.bridge{background:var(--fct); border-radius:var(--r); padding:14px 16px; font-size:14px}
.bridge h4{font-size:12px; letter-spacing:.07em; text-transform:uppercase; color:var(--fci); margin-bottom:6px}
.bridge .satz{font-weight:800; font-size:17px; line-height:1.25}
.bridge .satz b{color:var(--fci)}
.bridge p{margin:6px 0 0; color:var(--soft)}
.qa-d{background:var(--card); border:1px solid var(--line); border-radius:var(--r); margin-top:10px; overflow:hidden}
.qa-d summary{cursor:pointer; list-style:none; display:flex; align-items:center; gap:12px; padding:14px 16px; font-weight:700}
.qa-d summary i{font-style:normal; width:28px; height:28px; border-radius:50%; background:var(--fci); color:var(--card); display:flex; align-items:center; justify-content:center; font-size:13px; flex:none}
.qa-d summary span{margin-left:auto; font-weight:400; color:var(--soft); font-size:13px}
.qa-b{padding:0 16px 16px; font-size:15px}
.qa-b .frage{color:var(--soft); font-size:14px}
.qa-b .kern{background:var(--fct); border-radius:var(--rs); padding:10px 12px; font-weight:600; margin:10px 0}
.qa-b .model{font-family:'Source Serif 4',Georgia,serif; line-height:1.65}
.qa-b h5{margin:12px 0 4px; font-size:12px; letter-spacing:.07em; text-transform:uppercase; color:var(--soft)}
.qa-b ul{margin:0; padding-left:20px}

@media (max-width:640px){
  .now{grid-template-columns:1fr; padding:22px 20px}
  .now-ex{max-width:none}
  .trow{grid-template-columns:52px 1fr; gap:10px}
  .face{min-height:260px; padding:26px 22px 24px}
  .facts li{grid-template-columns:84px 1fr}
}
@media (prefers-reduced-motion:reduce){.now::after,.live{animation:none} .qin{transition:none}}

/* ====================== DIAGRAMM-RENDERER ====================== */
function diagSVG(v){
  if(!v) return "";
  const W=520;
  const colr = i => NETZFARBEN[i%NETZFARBEN.length];
  const box = (x,y,w,h,txt,i,fs) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="8" fill="${colr(i)}" fill-opacity="0.14" stroke="${colr(i)}" stroke-opacity="0.5"/>
    <foreignObject x="${x+4}" y="${y+2}" width="${w-8}" height="${h-4}"><div xmlns="http://www.w3.org/1999/xhtml" style="display:flex;align-items:center;justify-content:center;text-align:center;height:100%;word-break:break-word;overflow-wrap:break-word;font:${fs||12}px Archivo,sans-serif;font-weight:600;color:var(--ink);line-height:1.2">${esc(txt)}</div></foreignObject>`;
  const arrow = (x1,y1,x2,y2) => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="var(--soft)" stroke-width="1.5" marker-end="url(#arr)"/>`;
  const defs = `<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--soft)"/></marker></defs>`;

  if(v.t==="grid"){
    const n=v.l.length, cols=v.cols, rows=v.rows||Math.ceil(n/cols);
    const gap=8, pad=10, H = rows*70 + (v.ax?30:0) + pad*2;
    const cw=(W-pad*2-gap*(cols-1))/cols, ch=70;
    let inner="";
    v.l.forEach((txt,i)=>{
      const c=i%cols, r=Math.floor(i/cols);
      inner += box(pad+c*(cw+gap), pad+r*(ch+gap), cw, ch, txt, i, 12.5);
    });
    if(v.ax){
      inner += `<text x="${W/2}" y="${H-8}" text-anchor="middle" font-size="11" fill="var(--soft)" font-family="Archivo,sans-serif">${esc(v.ax[0])}</text>`;
      inner += `<text x="${pad}" y="${pad-2}" font-size="11" fill="var(--soft)" font-family="Archivo,sans-serif">${esc(v.ax[1])}</text>`;
    }
    if(v.note){ inner += `<text x="${W/2}" y="${H-8}" text-anchor="middle" font-size="11" fill="var(--soft)" font-family="Archivo,sans-serif">${esc(v.note)}</text>`; }
    return `<svg class="diag" viewBox="0 0 ${W} ${H}" role="img" aria-label="Diagramm">${inner}</svg>`;
  }

  if(v.t==="seq"){
    const n=v.l.length;
    if(v.dir==="v"){
      const bw=Math.min(300,W-40), bh=42, gap=22, pad=10;
      const H = n*bh + (n-1)*gap + pad*2;
      let inner="";
      v.l.forEach((txt,i)=>{
        const y=pad+i*(bh+gap);
        inner += box(W/2-bw/2, y, bw, bh, txt, i, 12.5);
        if(i<n-1) inner += arrow(W/2, y+bh+2, W/2, y+bh+gap-2);
      });
      return `<svg class="diag" viewBox="0 0 ${W} ${H}" role="img" aria-label="Ablauf">${defs}${inner}</svg>`;
    }
    const perRow = n>5?4:n, rows=Math.ceil(n/perRow);
    const gap=26, pad=10, bh=54;
    const bw=(W-pad*2-gap*(perRow-1))/perRow;
    const H = rows*bh + (rows-1)*34 + pad*2;
    let inner="";
    v.l.forEach((txt,i)=>{
      const c=i%perRow, r=Math.floor(i/perRow);
      const x=pad+c*(bw+gap), y=pad+r*(bh+34);
      inner += box(x,y,bw,bh,txt,i,12);
      if(c<perRow-1 && i<n-1) inner += arrow(x+bw+2, y+bh/2, x+bw+gap-2, y+bh/2);
    });
    const H2 = H;
    return `<svg class="diag" viewBox="0 0 ${W} ${H2}" role="img" aria-label="Ablauf">${defs}${inner}</svg>`;
  }

  if(v.t==="radial"){
    const H=320, cx=W/2, cy=H/2, R=110;
    const n=v.l.length;
    let inner = defs;
    if(v.cycle){
      const pts = v.l.map((txt,i)=>{ const a=(i/n)*Math.PI*2 - Math.PI/2; return {x:cx+Math.cos(a)*R, y:cy+Math.sin(a)*R, txt}; });
      pts.forEach((p,i)=>{ const q=pts[(i+1)%n];
        const dx=q.x-p.x, dy=q.y-p.y, len=Math.hypot(dx,dy), ux=dx/len, uy=dy/len, rad=44;
        inner += arrow(p.x+ux*rad, p.y+uy*rad, q.x-ux*rad, q.y-uy*rad);
      });
      pts.forEach((p,i)=>{ inner += `<circle cx="${p.x}" cy="${p.y}" r="40" fill="${colr(i)}" fill-opacity="0.16" stroke="${colr(i)}" stroke-opacity="0.6"/>
        <foreignObject x="${p.x-38}" y="${p.y-38}" width="76" height="76"><div xmlns="http://www.w3.org/1999/xhtml" style="display:flex;align-items:center;justify-content:center;text-align:center;height:100%;word-break:break-word;overflow-wrap:break-word;font:600 12px Archivo,sans-serif;color:var(--ink)">${esc(p.txt)}</div></foreignObject>`; });
      if(v.center) inner += `<text x="${cx}" y="${cy+4}" text-anchor="middle" font-size="13" font-weight="700" fill="var(--soft)" font-family="Archivo,sans-serif">${esc(v.center)}</text>`;
    } else {
      v.l.forEach((txt,i)=>{
        const a=(i/n)*Math.PI*2 - Math.PI/2;
        const x=cx+Math.cos(a)*R, y=cy+Math.sin(a)*R;
        inner += `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="var(--line)" stroke-width="1.5"/>`;
        inner += `<circle cx="${x}" cy="${y}" r="44" fill="${colr(i)}" fill-opacity="0.16" stroke="${colr(i)}" stroke-opacity="0.6"/>
        <foreignObject x="${x-42}" y="${y-42}" width="84" height="84"><div xmlns="http://www.w3.org/1999/xhtml" style="display:flex;align-items:center;justify-content:center;text-align:center;height:100%;word-break:break-word;overflow-wrap:break-word;font:600 11px Archivo,sans-serif;color:var(--ink)">${esc(txt)}</div></foreignObject>`;
      });
      inner += `<circle cx="${cx}" cy="${cy}" r="46" fill="var(--ink)"/>
        <foreignObject x="${cx-42}" y="${cy-42}" width="84" height="84"><div xmlns="http://www.w3.org/1999/xhtml" style="display:flex;align-items:center;justify-content:center;text-align:center;height:100%;font:700 12px Archivo,sans-serif;color:var(--bg)">${esc(v.center||"")}</div></foreignObject>`;
    }
    return `<svg class="diag" viewBox="0 0 ${W} ${H}" role="img" aria-label="Übersicht">${inner}</svg>`;
  }

  if(v.t==="triangle3"){
    const H=260, cx=W/2, cy=130, R=95;
    const pts = v.l.map((txt,i)=>{ const a=(i/3)*Math.PI*2 - Math.PI/2; return {x:cx+Math.cos(a)*R, y:cy+Math.sin(a)*R, txt}; });
    let inner = `<polygon points="${pts.map(p=>p.x+","+p.y).join(" ")}" fill="var(--ink)" fill-opacity="0.06" stroke="var(--line)"/>`;
    pts.forEach((p,i)=>{ inner += `<circle cx="${p.x}" cy="${p.y}" r="42" fill="${colr(i)}" fill-opacity="0.18" stroke="${colr(i)}" stroke-opacity="0.6"/>
      <foreignObject x="${p.x-40}" y="${p.y-40}" width="80" height="80"><div xmlns="http://www.w3.org/1999/xhtml" style="display:flex;align-items:center;justify-content:center;text-align:center;height:100%;word-break:break-word;overflow-wrap:break-word;font:700 13px Archivo,sans-serif;color:var(--ink)">${esc(p.txt)}</div></foreignObject>`; });
    return `<svg class="diag" viewBox="0 0 ${W} ${H}" role="img" aria-label="Dreieck">${inner}</svg>`;
  }

  if(v.t==="tree"){
    const n=v.l.length, H=200, pad=10, cw=(W-pad*2)/n;
    let inner = box(W/2-90,10,180,42,v.root,7,13);
    v.l.forEach((txt,i)=>{
      const x=pad+i*cw, y=110;
      inner += `<line x1="${W/2}" y1="52" x2="${x+cw/2}" y2="${y}" stroke="var(--line)" stroke-width="1.5"/>`;
      inner += box(x+6, y, cw-12, 42, txt, i, 12);
    });
    return `<svg class="diag" viewBox="0 0 ${W} ${H}" role="img" aria-label="Hierarchie">${inner}</svg>`;
  }

  if(v.t==="fishbone"){
    const H=240, spineY=130, bones=v.bones, n=bones.length;
    let inner = `<line x1="30" y1="${spineY}" x2="${W-90}" y2="${spineY}" stroke="var(--ink)" stroke-width="2" marker-end="url(#arr)"/>${defs}`;
    inner += box(W-84,spineY-24,74,48,v.head,6,12);
    bones.forEach((b,i)=>{
      const x = 60 + i*((W-160)/(n-1));
      const up = i%2===0;
      const y2 = up? spineY-70 : spineY+70;
      inner += `<line x1="${x}" y1="${spineY}" x2="${x+ (up?26:26)}" y2="${y2}" stroke="var(--soft)" stroke-width="1.5"/>`;
      inner += `<foreignObject x="${x-34}" y="${up?y2-30:y2+4}" width="100" height="30"><div xmlns="http://www.w3.org/1999/xhtml" style="text-align:center;font:600 12px Archivo,sans-serif;color:var(--ink)">${esc(b)}</div></foreignObject>`;
    });
    return `<svg class="diag" viewBox="0 0 ${W} ${H}" role="img" aria-label="Ishikawa-Diagramm">${inner}</svg>`;
  }

  if(v.t==="iceberg"){
    const H=260;
    let inner = `<line x1="0" y1="90" x2="${W}" y2="90" stroke="var(--soft)" stroke-dasharray="4 4"/>`;
    inner += `<polygon points="${W/2},18 ${W/2+42},90 ${W/2-42},90" fill="${colr(0)}" fill-opacity="0.22" stroke="${colr(0)}"/>`;
    inner += `<polygon points="${W/2-30},90 ${W/2+30},90 ${W/2+130},250 ${W/2-130},250" fill="${colr(2)}" fill-opacity="0.16" stroke="${colr(2)}"/>`;
    inner += `<foreignObject x="${W/2-70}" y="30" width="140" height="55"><div xmlns="http://www.w3.org/1999/xhtml" style="text-align:center;font:600 12px Archivo,sans-serif;color:var(--ink)">${v.top.map(esc).join(" · ")}</div></foreignObject>`;
    inner += `<foreignObject x="${W/2-125}" y="130" width="250" height="100"><div xmlns="http://www.w3.org/1999/xhtml" style="text-align:center;font:600 12.5px Archivo,sans-serif;color:var(--ink);line-height:1.7">${v.bottom.map(esc).join(" · ")}</div></foreignObject>`;
    return `<svg class="diag" viewBox="0 0 ${W} ${H}" role="img" aria-label="Eisbergmodell">${inner}</svg>`;
  }

  if(v.t==="bars"){
    const n=v.l.length, H=n*44+20, max=Math.max(...v.l.map(x=>x[1]));
    let inner="";
    v.l.forEach(([txt,val],i)=>{
      const y=10+i*44, bw=(val/max)*(W-190);
      inner += `<text x="0" y="${y+18}" font-size="12.5" fill="var(--ink)" font-family="Archivo,sans-serif">${esc(txt)}</text>`;
      inner += `<rect x="170" y="${y+4}" width="${bw}" height="20" rx="4" fill="${colr(i)}" fill-opacity="0.75"/>`;
      inner += `<text x="${170+bw+8}" y="${y+18}" font-size="12" fill="var(--soft)" font-family="Archivo,sans-serif">${val}%</text>`;
    });
    return `<svg class="diag" viewBox="0 0 ${W} ${H}" role="img" aria-label="Balkendiagramm">${inner}</svg>`;
  }

  if(v.t==="curve"){
    const H=220, pad=30;
    let path, mark;
    if(v.shape==="parabola"){ path = `M ${pad} ${H-pad} Q ${W/2} ${pad-10} ${W-pad} ${H-pad}`; mark={x:W/2,y:(H-10)/2}; }
    else { path = `M ${pad} ${H-pad} C ${W*0.5} ${H-pad}, ${W*0.7} ${H*0.4}, ${W-pad} ${pad}`; mark={x:W-pad,y:pad}; }
    let inner = `<line x1="${pad}" y1="${H-pad}" x2="${W-pad}" y2="${H-pad}" stroke="var(--line)"/>
      <line x1="${pad}" y1="${H-pad}" x2="${pad}" y2="${pad}" stroke="var(--line)"/>
      <path d="${path}" fill="none" stroke="var(--acc)" stroke-width="2.5"/>
      <circle cx="${mark.x}" cy="${mark.y}" r="5" fill="var(--acc)"/>
      <text x="${mark.x}" y="${mark.y-12}" text-anchor="middle" font-size="12" font-weight="600" fill="var(--ink)" font-family="Archivo,sans-serif">${esc(v.markLabel||"")}</text>`;
    return `<svg class="diag" viewBox="0 0 ${W} ${H}" role="img" aria-label="Funktionsgraf">${inner}</svg>`;
  }

  return "";
}

/* ====================== SPEICHER ====================== */
const LS = "hfwi-register-v1";
const store = {
  db:null, mode:"lokal",
  async init(){
    try{
      if(window.claude && claude.use){
        const d = await Promise.race([claude.use("db"), new Promise(r=>setTimeout(()=>r(null), 4000))]);
        if(d){ this.db = d; this.mode = "synchron"; }
      }
    }catch(e){ }
    const el = null;
    if(el) el.textContent = this.mode;
  },
  local(){ try{ return JSON.parse(localStorage.getItem(LS)||'{"projekte":[],"lern":{}}'); }catch(e){ return {projekte:[],lern:{}}; } },
  saveLocal(o){ try{ localStorage.setItem(LS, JSON.stringify(o)); }catch(e){} },
  async projekte(){
    if(this.db){
      try{
        const s = await this.db.collection("projekte").get();
        return s.docs.map(d => Object.assign({id:d.id}, d.data()));
      }catch(e){ }
    }
    return this.local().projekte;
  },
  async saveProjekt(p){
    if(this.db){
      try{ await this.db.doc("projekte/"+p.id).set(p); return true; }catch(e){ }
    }
    const o = this.local();
    const i = o.projekte.findIndex(x=>x.id===p.id);
    if(i>=0) o.projekte[i]=p; else o.projekte.push(p);
    this.saveLocal(o); return true;
  },
  async delProjekt(id){
    if(this.db){ try{ await this.db.doc("projekte/"+id).delete(); return true; }catch(e){ } }
    const o = this.local(); o.projekte = o.projekte.filter(x=>x.id!==id); this.saveLocal(o); return true;
  },
  async lern(){
    if(this.db){
      try{ const s = await this.db.doc("lernen/status").get(); if(s.exists) return s.data().k||{}; }catch(e){ }
    }
    return this.local().lern||{};
  },
  async saveLern(k){
    if(this.db){ try{ await this.db.doc("lernen/status").set({k:k}); return; }catch(e){ } }
    const o = this.local(); o.lern = k; this.saveLocal(o);
  }
};


/* ====================== RECHNER ====================== */
const nf = (x,d) => (isFinite(x)? Number(x).toLocaleString("de-CH",{minimumFractionDigits:d==null?2:d, maximumFractionDigits:d==null?2:d}) : "–");
function num(id){ const v = parseFloat((document.getElementById(id)||{}).value); return isFinite(v)?v:0; }

const CALC = {
subnet(){
  return {html:`
    <div class="grid g3">
      <div><label for="c-ip">IP-Adresse</label><input type="text" id="c-ip" value="192.168.10.37"></div>
      <div><label for="c-pre">Präfix</label><input type="number" id="c-pre" value="26" min="1" max="32"></div>
    </div>
    <div class="row"><button class="btn" type="button" id="c-go">Berechnen</button></div>
    <div id="c-out" style="margin-top:14px"></div>`,
   run(){
    const ip = (document.getElementById("c-ip").value||"").trim().split(".").map(Number);
    const pre = Math.min(32, Math.max(1, num("c-pre")));
    const out = document.getElementById("c-out");
    if(ip.length!==4 || ip.some(x=>!isFinite(x)||x<0||x>255)){ out.innerHTML = '<p class="meta">Die IP-Adresse braucht vier Zahlen von 0 bis 255.</p>'; return; }
    const m = pre===0?0:(0xFFFFFFFF << (32-pre))>>>0;
    const a = ((ip[0]<<24)>>>0)+(ip[1]<<16)+(ip[2]<<8)+ip[3];
    const net = (a & m)>>>0, bc = (net | (~m>>>0))>>>0;
    const d = x => [(x>>>24)&255,(x>>>16)&255,(x>>>8)&255,x&255].join(".");
    const hosts = pre>=31 ? (pre===31?2:1) : Math.pow(2,32-pre)-2;
    out.innerHTML = `<table>
      <tr><th>Netzmaske</th><td>${d(m)}</td></tr>
      <tr><th>Netzadresse</th><td>${d(net)}/${pre}</td></tr>
      <tr><th>Erste Hostadresse</th><td>${pre<31?d(net+1):"–"}</td></tr>
      <tr><th>Letzte Hostadresse</th><td>${pre<31?d(bc-1):"–"}</td></tr>
      <tr><th>Broadcast</th><td>${pre<31?d(bc):"–"}</td></tr>
      <tr><th>Nutzbare Hosts</th><td>${nf(hosts,0)}</td></tr>
      <tr><th>Wildcard</th><td>${d((~m)>>>0)}</td></tr></table>`;
   }};
},
invest(){
  return {html:`
    <div class="grid g3">
      <div><label for="c-an">Anschaffungswert (CHF)</label><input type="number" id="c-an" value="120000"></div>
      <div><label for="c-rf">Rückfluss pro Jahr (CHF)</label><input type="number" id="c-rf" value="32000"></div>
      <div><label for="c-nd">Nutzungsdauer (Jahre)</label><input type="number" id="c-nd" value="5"></div>
      <div><label for="c-zs">Kalkulationszins (%)</label><input type="number" id="c-zs" value="6" step="0.1"></div>
      <div><label for="c-rw">Restwert (CHF)</label><input type="number" id="c-rw" value="10000"></div>
    </div>
    <div class="row"><button class="btn" type="button" id="c-go">Berechnen</button></div>
    <div id="c-out" style="margin-top:14px"></div>`,
   run(){
    const an=num("c-an"), rf=num("c-rf"), nd=Math.max(1,Math.round(num("c-nd"))), i=num("c-zs")/100, rw=num("c-rw");
    let bar=0; for(let t=1;t<=nd;t++) bar += rf/Math.pow(1+i,t);
    bar += rw/Math.pow(1+i,nd);
    const kw = bar - an;
    const amo = rf>0 ? an/rf : Infinity;
    const abschr = (an-rw)/nd;
    const gewinn = rf - abschr;
    const kap = (an+rw)/2;
    const rend = kap>0 ? gewinn/kap*100 : 0;
    document.getElementById("c-out").innerHTML = `<table>
      <tr><th>Barwert aller Rückflüsse</th><td class="n">${nf(bar)}</td></tr>
      <tr><th>Kapitalwert (NPV)</th><td class="n" style="color:${kw>=0?'var(--ok)':'var(--plum)'}">${nf(kw)}</td></tr>
      <tr><th>Amortisationsdauer</th><td class="n">${isFinite(amo)?nf(amo,1)+" Jahre":"–"}</td></tr>
      <tr><th>Kalkulatorische Abschreibung pro Jahr</th><td class="n">${nf(abschr)}</td></tr>
      <tr><th>Durchschnittlicher Gewinn pro Jahr</th><td class="n">${nf(gewinn)}</td></tr>
      <tr><th>Rentabilität auf dem Durchschnittskapital</th><td class="n">${nf(rend,1)} %</td></tr></table>
      <p class="meta" style="margin-top:10px">${kw>=0?"Kapitalwert über null, die Investition erwirtschaftet mehr als den Kalkulationszins.":"Kapitalwert unter null, die geforderte Verzinsung wird nicht erreicht."}</p>`;
   }};
},

/* ====================== WISSENSNETZ ====================== */
let NZ = {sim:null, sel:null, map:"wi", nodes:[], links:[], adj:{}};

function baueNetz(key){
  const def = NETZE[key];
  const nodes = [], links = [], byName = {};
  const add = n => { nodes.push(n); byName[n.name]=n; return n; };
  const root = add({id:"r", name:def.n, typ:"root", d:def.d, g:-1});
  def.b.forEach((b,gi)=>{
    const bn = add({id:"b"+gi, name:b.n, typ:"bereich", d:b.d, g:gi});
    links.push({source:root.id, target:bn.id, typ:"baum"});
    b.t.forEach((t,ti)=>{
      const tool = t[1] ? toolById(t[1]) : null;
      let n = byName[t[0]];
      if(!n){
        n = add({id:"t"+gi+"_"+ti, name:t[0], typ:"thema", g:gi, tool:tool?tool.id:null,
                 d: t[2] || (tool?tool.kurz:""), mods: tool?(tool.m||[]):[]});
      }
      links.push({source:bn.id, target:n.id, typ:"baum"});
    });
  });
  (def.x||[]).forEach(([a,b])=>{ if(byName[a]&&byName[b]) links.push({source:byName[a].id, target:byName[b].id, typ:"quer"}); });
  const adj = {}; nodes.forEach(n=>adj[n.id]=new Set());
  links.forEach(l=>{ adj[l.source].add(l.target); adj[l.target].add(l.source); });
  return {nodes, links, adj, def};
}

    <div style="display:flex;gap:10px;align-items:center"><span class="meta" id="nzhint"></span><input type="search" id="nzq" class="srch" placeholder="Thema im Netz finden" style="width:220px"></div>

  </div>
  <p class="meta" style="margin-top:10px">Ziehen zum Verschieben, scrollen oder zwei Finger zum Zoomen, Knoten antippen für Details.</p>`;

function panelHtml(n){
  if(!n){
    const d = NETZE[NZ.map];
    return `<h3 style="color:var(--soft);font-size:13px;font-weight:600">${esc(d.n)}</h3>
      <p class="serif" style="font-size:15.5px">${esc(d.d)}</p>
      <div class="chips" style="margin-top:12px">${d.b.map((b,i)=>`<button class="chip" type="button" data-nzsel="b${i}" style="border-color:${NETZFARBEN[i%NETZFARBEN.length]}">${esc(b.n)}</button>`).join("")}</div>`;
  }
  const col = n.g>=0 ? NETZFARBEN[n.g%NETZFARBEN.length] : "var(--ink)";
  const nb = Array.from(NZ.adj[n.id]).map(id=>NZ.nodes.find(x=>x.id===id)).filter(Boolean)
             .sort((a,b)=>({root:0,bereich:1,thema:2}[a.typ]-({root:0,bereich:1,thema:2}[b.typ])));
  const typ = {root:"Fachgebiet", bereich:"Bereich", thema: n.tool?"Methode":"Thema"}[n.typ];
  const mods = (n.mods||[]).map(modByK).filter(Boolean);
  return `
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px"><span class="dot" style="background:${col}"></span><span class="meta">${typ}</span></div>
    <h3 style="font-size:20px;margin-bottom:10px">${esc(n.name)}</h3>
    ${n.d?`<p class="serif" style="font-size:15.5px">${esc(n.d)}</p>`:""}
    ${n.tool?`<button class="btn" type="button" data-tool="${n.tool}" style="margin:6px 0 14px">Methode öffnen</button>`:""}
    ${mods.length?`<div class="meta" style="margin:6px 0 6px">Gelernt in</div><div class="chips">${mods.map(m=>`<button class="chip" type="button" data-mod="${m.k}">${esc(m.n)}</button>`).join("")}</div>`:""}
    <div class="meta" style="margin:16px 0 6px">Verbunden mit</div>
    <div class="chips">${nb.map(x=>`<button class="chip" type="button" data-nzsel="${x.id}">${esc(x.name)}</button>`).join("")}</div>
    <p style="margin-top:16px"><button class="back" type="button" data-nzsel="" style="margin:0">Auswahl aufheben</button></p>`;
}

function mountNetz(){
  const host = document.getElementById("netz");
  document.getElementById("nzpanel").innerHTML = panelHtml(null);
  if(NZ.sim){ NZ.sim.stop(); NZ.sim=null; }
  if(!window.d3){
    host.innerHTML = `<div class="empty" style="border:0">Die Grafik konnte nicht geladen werden. Die Bereiche findest du rechts als Liste.</div>`;
    return;
  }
  const G = baueNetz(NZ.map);
  NZ.nodes = G.nodes; NZ.links = G.links; NZ.adj = G.adj; NZ.sel = null;
  const W = host.clientWidth || 800, H = host.clientHeight || 600;
  const nB = G.def.b.length;
  const R1 = 160, R2 = 340;
  // Feste Zielpositionen: Themen gleichmässig auf dem äusseren Ring, Bereiche in der Mitte ihrer Themen
  const themen = G.nodes.filter(n=>n.typ==="thema");
  const T = themen.length;
  themen.forEach((n,i)=>{ n.a = (i+0.5)/T*Math.PI*2 - Math.PI/2; n.tx = Math.cos(n.a)*R2; n.ty = Math.sin(n.a)*R2; });
  G.nodes.filter(n=>n.typ==="bereich").forEach(b=>{
    const eig = themen.filter(t=>t.g===b.g);
    let sx=0, sy=0; eig.forEach(t=>{ sx+=Math.cos(t.a); sy+=Math.sin(t.a); });
    b.a = Math.atan2(sy, sx); b.tx = Math.cos(b.a)*R1; b.ty = Math.sin(b.a)*R1;
  });
  G.nodes.forEach(n=>{
    if(n.typ==="root"){ n.tx=0; n.ty=0; n.fx=0; n.fy=0; }
    n.x = n.tx; n.y = n.ty;
  });
  const svg = d3.select(host).html("").append("svg")
    .attr("viewBox",[-W/2,-H/2,W,H]).attr("width","100%").attr("height","100%").attr("role","img").attr("aria-label","Wissensnetz "+G.def.n);
  const g = svg.append("g");
  // Netzringe
  const web = g.append("g").attr("class","web");
  [R1*0.5,R1,(R1+R2)/2,R2,R2+60].forEach(r=>web.append("circle").attr("r",r));
  G.nodes.filter(n=>n.typ==="bereich").forEach(b=>web.append("line").attr("x1",0).attr("y1",0).attr("x2",Math.cos(b.a)*(R2+60)).attr("y2",Math.sin(b.a)*(R2+60)));

  const link = g.append("g").selectAll("line").data(G.links).join("line")
    .attr("class",d=>"lk "+d.typ);
  const node = g.append("g").selectAll("g").data(G.nodes).join("g")
    .attr("class",d=>"nd "+d.typ).attr("tabindex",0).style("cursor","pointer");
  node.append("circle")
    .attr("r",d=>d.typ==="root"?34:d.typ==="bereich"?14:(d.tool?7.5:6))
    .attr("fill",d=>d.typ==="root"?"var(--ink)":NETZFARBEN[d.g%NETZFARBEN.length])
    .attr("stroke","var(--card)").attr("stroke-width",d=>d.typ==="thema"?1.5:2.5)
    .attr("fill-opacity",d=>d.typ==="thema"&&!d.tool?0.55:1);
  node.append("text").attr("class","lb")
    .text(d=>d.name)
    .attr("dy",d=>d.typ==="root"?56:"0.34em");
  node.filter(d=>d.typ==="root").append("text").attr("class","lbr").attr("dy","0.34em").text("●").attr("fill","var(--bg)");

  const sim = d3.forceSimulation(G.nodes)
    .force("x", d3.forceX(d=>d.tx).strength(d=>d.typ==="thema"?0.55:0.7))
    .force("y", d3.forceY(d=>d.ty).strength(d=>d.typ==="thema"?0.55:0.7))
    .force("link", d3.forceLink(G.links).id(d=>d.id).strength(0))
    .force("collide", d3.forceCollide(d=>d.typ==="root"?44:d.typ==="bereich"?18:8))
    .alpha(0.6).alphaDecay(0.05);
  NZ.sim = sim;

  function tick(){
    link.attr("x1",d=>d.source.x).attr("y1",d=>d.source.y).attr("x2",d=>d.target.x).attr("y2",d=>d.target.y);
    node.attr("transform",d=>`translate(${d.x},${d.y})`);
    node.select("text.lb").each(function(d){
      if(d.typ==="root"){ this.setAttribute("text-anchor","middle"); return; }
      const deg = Math.atan2(d.y, d.x)*180/Math.PI;
      const links = d.x < 0;
      const off = d.typ==="bereich" ? 20 : 12;
      this.setAttribute("transform", "rotate(" + (links ? deg+180 : deg) + ")");
      this.setAttribute("text-anchor", links ? "end" : "start");
      this.setAttribute("dx", links ? -off : off);
    });
  }
  sim.on("tick", tick);
  NZ.node = node; NZ.link = link;

  const zoom = d3.zoom().extent([[-W/2,-H/2],[W/2,H/2]]).scaleExtent([0.3,3.5]).on("zoom", e=>g.attr("transform", e.transform));
  svg.call(zoom);
  const k = Math.min(W/2/(R2+175), H/2/(R2+175));
  svg.call(zoom.transform, d3.zoomIdentity.scale(Math.max(0.3,Math.min(1.2,k))));
  NZ.zoom = zoom; NZ.svg = svg;

  node.call(d3.drag()
    .on("start",(e,d)=>{ if(!e.active) sim.alphaTarget(0.2).restart(); d.fx=d.x; d.fy=d.y; })
    .on("drag",(e,d)=>{ d.fx=e.x; d.fy=e.y; })
    .on("end",(e,d)=>{ if(!e.active) sim.alphaTarget(0); if(d.typ!=="root"){ d.fx=null; d.fy=null; } }));

  node.on("click",(e,d)=>{ e.stopPropagation(); waehle(d.id, false); })
      .on("keydown",(e,d)=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); waehle(d.id,false); } })
      .on("mouseenter",(e,d)=>{ if(!NZ.sel) hebeHervor(d.id); })
      .on("mouseleave",()=>{ if(!NZ.sel) hebeHervor(null); });
  svg.on("click",()=>waehle(null));
  NZ.node = node; NZ.link = link;
}

function hebeHervor(id){
  if(!NZ.node) return;
  if(!id){ NZ.node.classed("dim",false).classed("on",false); NZ.link.classed("dim",false).classed("on",false); return; }
  const nb = NZ.adj[id];
  NZ.node.classed("dim",d=>d.id!==id && !nb.has(d.id)).classed("on",d=>d.id===id);
  NZ.link.classed("dim",l=>l.source.id!==id && l.target.id!==id).classed("on",l=>l.source.id===id||l.target.id===id);
}

function waehle(id, zentrieren){
  NZ.sel = id || null;
  const n = id ? NZ.nodes.find(x=>x.id===id) : null;
  hebeHervor(NZ.sel);
  const p = document.getElementById("nzpanel"); if(p) p.innerHTML = panelHtml(n);
  if(n && zentrieren!==false && NZ.svg && NZ.zoom){
    const t = d3.zoomTransform(NZ.svg.node());
    const s = Math.max(t.k, 0.9);
    NZ.svg.transition().duration(450).call(NZ.zoom.transform, d3.zoomIdentity.scale(s).translate(-n.x, -n.y));
  }
  if(n && window.innerWidth<860 && p){ p.scrollIntoView({behavior:"smooth", block:"nearest"}); }
}

function bindNetz(){
  const q = document.getElementById("nzq");
  if(q){
    const treffer = s => {
      const inName = NZ.nodes.filter(d=>d.name.toLowerCase().includes(s));
      return inName.length ? inName : NZ.nodes.filter(d=>(d.d||"").toLowerCase().includes(s));
    };
    q.addEventListener("input", e=>{
      const s = e.target.value.trim().toLowerCase();
      const hint = document.getElementById("nzhint");
      if(!NZ.node) return;
      if(s.length<2){ NZ.node.classed("hit",false); hebeHervor(NZ.sel); if(hint) hint.textContent=""; return; }
      const ids = new Set(treffer(s).map(d=>d.id));
      if(hint) hint.textContent = ids.size ? ids.size+" Treffer, Enter zum Anspringen" : "Nichts gefunden";
      if(!ids.size){ NZ.node.classed("hit",false); hebeHervor(NZ.sel); return; }
      NZ.node.classed("hit", d=>ids.has(d.id)).classed("dim", d=>!ids.has(d.id));
      NZ.link.classed("dim", true).classed("on", false);
    });
    q.addEventListener("keydown", e=>{
      if(e.key!=="Enter") return;
      const s = e.target.value.trim().toLowerCase();
      const n = treffer(s)[0];
      if(n){ NZ.node.classed("hit",false); waehle(n.id, true); const h=document.getElementById("nzhint"); if(h) h.textContent=""; }
    });
  }
  mountNetz();
}

/* ====================== METHODEN ====================== */
function vMethoden(){
  const kats = ["Alle", ...Array.from(new Set(WERKZEUGE.map(t=>t.kat))).sort()];
  let list = WERKZEUGE.filter(t=>S.kat==="Alle"||t.kat===S.kat);
  const m = S.mod ? modByK(S.mod) : null;
  if(m) list = list.filter(t=>(t.m||[]).includes(m.k));
  return `
  <div class="hero">
    <h1>${m?esc(m.n):"Methoden"}</h1>
    <p>${m?`${esc(SEMINFO[m.s].n)}. ${esc(m.pruef)}`:"Nachschlagen, wie es geht und wofür. Fünf davon rechnen für dich."}</p>
  </div>
  <div class="bar">
    ${m?`<button class="chip x" type="button" data-clearmod="1" aria-pressed="true">${esc(m.k)}</button>`:""}
    <div class="chips">${kats.map(k=>`<button class="chip" type="button" data-kat="${esc(k)}" aria-pressed="${S.kat===k}">${esc(k)}</button>`).join("")}</div>
  </div>
  ${m && m.t ? `<details class="box" style="margin-top:16px"><summary style="cursor:pointer;font-weight:600">Themen im Modul</summary>
     <div class="serif" style="margin-top:12px">${m.t.map(t=>`<p style="margin-bottom:10px"><b style="font-family:Archivo,sans-serif;font-size:14.5px">${esc(t.h)}</b><br>${esc(t.p.join(", "))}</p>`).join("")}</div></details>`:""}

function cardMethode(t){

}

    : `<div class="empty">Noch nichts abgelegt. Wenn du das nächste Mal eine Methode bei der Arbeit einsetzt, halte es hier fest.</div>`}`;
}

function vProjekt(){
  const neu = S.id==="neu";
  if(!S.entwurf || S.entwurf._for!==S.id){
    const p = neu ? {id:uid(), titel:"", kontext:"Arbeit", status:"Laufend", datum:new Date().toISOString().slice(0,10),
                     problem:"", loesung:"", erkenntnis:"", tools:(S.vorTool?[S.vorTool]:[]), module:[]}
                  : S.projekte.find(x=>x.id===S.id);
    if(!p) return vProjekte();
    S.entwurf = JSON.parse(JSON.stringify(p)); S.entwurf._for = S.id; S.pickQ="";
  }
  const e = S.entwurf;
  return `
  <button class="back" type="button" data-go="projekte">‹ Alle Projekte</button>
  <div class="hero"><h1>${neu?"Neues Projekt":esc(e.titel||"Projekt")}</h1></div>
  <div class="det">
    <div class="box">
      <label for="f-titel" style="margin-top:0">Titel</label>
      <input type="text" id="f-titel" value="${esc(e.titel)}" placeholder="Zum Beispiel: Berechtigungen beim Kunden neu aufgebaut">
      <label for="f-problem">Was war das Problem?</label>
      <textarea id="f-problem">${esc(e.problem||"")}</textarea>
      <label for="f-loesung">Wie hast du es gelöst?</label>
      <textarea id="f-loesung">${esc(e.loesung||"")}</textarea>
      <label for="f-erkenntnis">Was nimmst du mit?</label>
      <textarea id="f-erkenntnis">${esc(e.erkenntnis||"")}</textarea>
      <div class="acts">
        <button class="btn" type="button" id="save">Speichern</button>
        <button class="btn l" type="button" data-go="projekte">Abbrechen</button>
        ${neu?"":`<button class="btn d" type="button" id="del">Löschen</button>`}
      </div>
    </div>
    <aside class="side">
      <div class="box">
        <label for="f-kontext" style="margin-top:0">Wo</label>
        <select id="f-kontext">${KONTEXT.map(k=>`<option ${e.kontext===k?"selected":""}>${k}</option>`).join("")}</select>
        <label for="f-status">Stand</label>
        <select id="f-status">${STATUS.map(k=>`<option ${e.status===k?"selected":""}>${k}</option>`).join("")}</select>
        <label for="f-datum">Datum</label>
        <input type="text" id="f-datum" value="${esc(e.datum||"")}">
      </div>
      <div class="box">
        <h3>Methoden</h3>
        <div class="chips picked" id="picked">${pickedHtml()}</div>
        <input type="search" id="pickq" placeholder="Methode suchen" value="${esc(S.pickQ)}">
        <div class="plist" id="plist" style="margin-top:8px">${plistHtml()}</div>
      </div>
    </aside>
  </div>`;
}
function pickedHtml(){
  const a = S.entwurf.tools||[];
  return a.length ? a.map(i=>{const t=toolById(i); return t?`<button class="chip x" type="button" data-pick="${t.id}" aria-pressed="true">${esc(t.n)}</button>`:"";}).join("")
                  : `<span class="meta">Noch keine gewählt.</span>`;
}
function plistHtml(){
  const q = S.pickQ.toLowerCase(), a = S.entwurf.tools||[];
  return WERKZEUGE.filter(t=>!a.includes(t.id) && (!q || (t.n+" "+t.kat).toLowerCase().includes(q)))
    .map(t=>`<button class="chip" type="button" data-pick="${t.id}">${esc(t.n)}</button>`).join("") || `<span class="meta">Nichts gefunden.</span>`;
}
function syncForm(){
  const e = S.entwurf; if(!e) return;
  const g = id => { const x=document.getElementById(id); return x?x.value:null; };
  ["titel","problem","loesung","erkenntnis","kontext","status","datum"].forEach(f=>{ const v=g("f-"+f); if(v!=null) e[f]=v; });
}
function bindForm(){
  const pq = document.getElementById("pickq");
  if(pq) pq.addEventListener("input", ev=>{ S.pickQ = ev.target.value; document.getElementById("plist").innerHTML = plistHtml(); });
  const save = document.getElementById("save");
  if(save) save.onclick = async ()=>{
    syncForm();
    const d = Object.assign({}, S.entwurf); delete d._for;
    d.titel = (d.titel||"").trim() || "Ohne Titel";
    d.module = Array.from(new Set((d.tools||[]).flatMap(i=>(toolById(i)||{}).m||[])));
    save.textContent = "Speichert";
    await store.saveProjekt(d);
    S.projekte = await store.projekte(); S.entwurf = null; S.vorTool = null;
    go("projekte");
  };
  const del = document.getElementById("del");
  if(del) del.onclick = async ()=>{
    if(!confirm("Dieses Projekt löschen?")) return;
    await store.delProjekt(S.entwurf.id);
    S.projekte = await store.projekte(); S.entwurf = null; go("projekte");
  };
}

/* ====================== LERNEN ====================== */
function bauKarten(){
  const k = [];
  WERKZEUGE.forEach(t=>{
    if(S.lernMod!=="Alle" && !(t.m||[]).includes(S.lernMod)) return;
    k.push({id:"t-"+t.id, f:t.n, r:esc(t.kurz)+"<br><br>"+t.s.slice(0,4).map(x=>"· "+esc(x)).join("<br>"), s:toolSem(t)});
  });
  MODULE.forEach(m=>{
    if(S.lernMod!=="Alle" && S.lernMod!==m.k) return;
    m.t.forEach((t,i)=>{
      if(t.p.length===1 && /nachzutragen/.test(t.p[0])) return;
      k.push({id:"m-"+m.k+"-"+i, f:"Was gehört zu "+t.h+"?", r:t.p.map(x=>"· "+esc(x)).join("<br>"), s:m.s});
    });
  });
  return k;
}
function vLernen(){
  S.karten = bauKarten();
  const n = S.karten.length; if(S.li>=n) S.li=0;
  const c = S.karten[S.li];
  const gek = S.karten.filter(x=>(S.stat[x.id]||0)>0).length;
  return `
  <div class="hero"><h1>Lernen</h1><p>Karte antippen, Antwort prüfen, ehrlich bewerten.</p></div>
  <div class="chips" style="margin-bottom:18px"><span class="meta" style="align-self:center">Auf eine Prüfung lernen:</span>${Object.keys(DECKS).map(k=>`<button class="chip fc" type="button" data-deck="${k}" style="${fcVar(DECKS[k].f)}">${esc(DECKS[k].n)}</button>`).join("")}</div>
  <div style="max-width:720px">
    <select id="lernmod" aria-label="Modul wählen">
      <option value="Alle">Alle Module</option>
      ${[1,2,3].map(s=>`<optgroup label="${SEMINFO[s].n}">${MODULE.filter(m=>m.s===s).map(m=>`<option value="${m.k}" ${S.lernMod===m.k?"selected":""}>${esc(m.n)}</option>`).join("")}</optgroup>`).join("")}
    </select>
    <div class="prog"><i style="width:${n?Math.round(gek/n*100):0}%"></i></div>
    <div class="meta" style="margin-bottom:16px">${gek} von ${n} gekonnt</div>
    ${c?`
    <div class="flash" id="flash" style="${semVar(c.s)}">
      <div class="q">${esc(c.f)}</div>
      ${S.auf?`<div class="a">${c.r}</div>`:`<div class="h">Antippen zum Umdrehen</div>`}
    </div>
    <div class="acts">
      ${S.auf?`<button class="btn l" type="button" data-bew="0">Nochmal</button><button class="btn" type="button" data-bew="1">Gekonnt</button>`
             :`<button class="btn" type="button" id="flip">Umdrehen</button>`}
      <button class="btn l" type="button" data-skip="1">Weiter</button>
    </div>
    <p class="meta" style="margin-top:22px"><button class="back" type="button" id="reset" style="margin:0">Fortschritt zurücksetzen</button></p>`
    :`<div class="empty">Für dieses Modul gibt es noch keine Karten.</div>`}
  </div>`;
}

/* ====================== SUCHE ====================== */
function vSuche(){
  const q = S.q.toLowerCase();
  const tt = WERKZEUGE.filter(t=>(t.n+" "+t.kurz+" "+t.wf+" "+t.s.join(" ")+" "+t.kat).toLowerCase().includes(q));
  const mm = MODULE.filter(m=>(m.n+" "+m.k+" "+m.t.map(t=>t.h+" "+t.p.join(" ")).join(" ")).toLowerCase().includes(q));
  const pp = S.projekte.filter(p=>(p.titel+" "+(p.problem||"")+" "+(p.loesung||"")+" "+(p.erkenntnis||"")).toLowerCase().includes(q));
  const tot = tt.length+mm.length+pp.length;
  return `<div class="hero"><h1>Suche</h1><p>${tot} Treffer für „${esc(S.q)}“</p></div>
  ${!tot?`<div class="empty">Nichts gefunden. Versuch es mit einem anderen Begriff.</div>`:""}
  ${mm.length?`<div class="chips" style="margin-bottom:8px">${mm.map(m=>`<button class="chip" type="button" data-mod="${m.k}" style="${semVar(m.s)}">${esc(m.n)}</button>`).join("")}</div>`:""}
  ${pp.length?`<div class="box" style="margin-top:14px">${pp.map(itemProjekt).join("")}</div>`:""}
  ${tt.length?`<div class="mgrid">${tt.map(cardMethode).join("")}</div>`:""}`;
}

function icsText(){
  const esc = s => String(s).replace(/\\/g,"\\\\").replace(/;/g,"\;").replace(/,/g,"\\,").replace(/\n/g,"\\n");
  const fold = l => { const o=[]; while(l.length>73){ o.push(l.slice(0,73)); l=" "+l.slice(73); } o.push(l); return o.join("\r\n"); };
  const dt = (d,t) => d.replace(/-/g,"")+"T"+t.replace(":","")+"00";
  const plus = (t,min) => { const [h,m]=t.split(":").map(Number); const x=Math.min(h*60+m+min, 23*60+59); return String(Math.floor(x/60)).padStart(2,"0")+":"+String(x%60).padStart(2,"0"); };
  const L = ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Register HFWI//Termine//DE","CALSCALE:GREGORIAN","METHOD:PUBLISH",
    "X-WR-CALNAME:HFWI Schule","X-WR-TIMEZONE:Europe/Zurich","REFRESH-INTERVAL;VALUE=DURATION:PT12H","X-PUBLISHED-TTL:PT12H",
    "BEGIN:VTIMEZONE","TZID:Europe/Zurich",
    "BEGIN:STANDARD","DTSTART:19701025T030000","RRULE:FREQ=YEARLY;BYMONTH=10;BYDAY=-1SU","TZOFFSETFROM:+0200","TZOFFSETTO:+0100","TZNAME:CET","END:STANDARD",
    "BEGIN:DAYLIGHT","DTSTART:19700329T020000","RRULE:FREQ=YEARLY;BYMONTH=3;BYDAY=-1SU","TZOFFSETFROM:+0100","TZOFFSETTO:+0200","TZNAME:CEST","END:DAYLIGHT",
    "END:VTIMEZONE"];
  TERMINE_ROH.forEach(([d,von,bis,f,art,t,th])=>{
    const name = FACH[f].kn||FACH[f].n;
    const pre = art==="p"?"PRÜFUNG ":art==="a"?"ABGABE ":"";
    const start = art==="a" ? plus(von,-30) : von;
    L.push("BEGIN:VEVENT",
      "UID:"+d+"-"+f+"-"+art+"-"+von.replace(":","")+"@register-hfwi",
      "DTSTAMP:"+STAND.replace(/-/g,"")+"T120000Z",
      "DTSTART;TZID=Europe/Zurich:"+dt(d,start),
      "DTEND;TZID=Europe/Zurich:"+dt(d, art==="a"?von:(bis||plus(von,60))),
      "SUMMARY:"+esc(pre+name+" · "+t));
    if(art!=="a" && f!=="HF") L.push("LOCATION:"+esc("BZBS Buchs, "+ORT));
    if(th) L.push("DESCRIPTION:"+esc(th));
    if(art!=="u") L.push("BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:"+esc(pre+name),"TRIGGER:-P7D","END:VALARM",
                         "BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:"+esc(pre+name),"TRIGGER:-P1D","END:VALARM");
    L.push("END:VEVENT");
  });
  L.push("END:VCALENDAR");
  return L.map(fold).join("\r\n")+"\r\n";
}
