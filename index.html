<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Register HFWI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#16212B; --soft:#56646F; --bg:#F2F4F1; --card:#FFFFFF; --line:#DCE1DC;
  --s1:#12565C; --s1t:#E3F0EF;
  --s2:#6B2D5C; --s2t:#F3E6EF;
  --s3:#8A5A0F; --s3t:#F6EEDD;
  --acc:#12565C; --ok:#2F6B3A;
  --r:14px; --rs:9px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#E8ECE8; --soft:#9CA8AA; --bg:#0F1416; --card:#182022; --line:#2A3437;
    --s1:#6CC0C4; --s1t:#15302F; --s2:#D69CC4; --s2t:#2E1C29; --s3:#E0B35F; --s3t:#2E2513;
    --acc:#6CC0C4; --ok:#86C592;
  }
}
:root[data-theme="dark"]{
  --ink:#E8ECE8; --soft:#9CA8AA; --bg:#0F1416; --card:#182022; --line:#2A3437;
  --s1:#6CC0C4; --s1t:#15302F; --s2:#D69CC4; --s2t:#2E1C29; --s3:#E0B35F; --s3t:#2E2513;
  --acc:#6CC0C4; --ok:#86C592;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px); -webkit-text-size-adjust:100%}
body{margin:0; background:var(--bg); color:var(--ink); font-family:Archivo,'Segoe UI',system-ui,sans-serif; font-size:15.5px; line-height:1.5}
h1,h2,h3,h4{margin:0; line-height:1.15; letter-spacing:-0.015em}
p{margin:0 0 .6em}
button{font:inherit; color:inherit}

/* Kopf */
.top{position:sticky; top:0; z-index:30; background:var(--bg); border-bottom:1px solid var(--line); padding-top:env(safe-area-inset-top,0px)}
.topin{max-width:1060px; margin:0 auto; padding:12px 22px; display:flex; align-items:center; gap:18px}
.logo{font-weight:800; font-size:18px; letter-spacing:-0.03em; white-space:nowrap; background:none; border:0; cursor:pointer; padding:0}
.logo span{color:var(--acc)}
.tabs{display:flex; gap:4px; flex:1}
.tabs button{background:none; border:0; padding:8px 13px; border-radius:99px; cursor:pointer; color:var(--soft); font-weight:500; white-space:nowrap}
.tabs button:hover{color:var(--ink); background:var(--card)}
.tabs button[aria-current="true"]{background:var(--ink); color:var(--bg)}
.tools-r{display:flex; gap:8px; align-items:center}
.srch{background:var(--card); border:1px solid var(--line); border-radius:99px; padding:7px 14px; font:inherit; color:var(--ink); width:200px}
.top .srch{width:200px; padding:7px 14px; border-radius:99px; background:var(--card)}
.icon{background:var(--card); border:1px solid var(--line); border-radius:99px; width:36px; height:36px; cursor:pointer; font-size:15px}
.wrap{max-width:1060px; margin:0 auto; padding:30px 22px 60px}

/* Kopftext der Seiten */
.hero{margin-bottom:26px}
.hero h1{font-size:clamp(28px,4vw,40px); font-weight:800}
.hero p{color:var(--soft); margin-top:8px; max-width:56ch; font-size:16px}

/* Studienweg */
.weg{display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-bottom:30px}
.sem{border-radius:var(--r); padding:18px 16px 16px; background:var(--card); border:1px solid var(--line); position:relative; overflow:hidden}
.sem::before{content:""; position:absolute; left:0; top:0; right:0; height:5px; background:var(--c)}
.sem h2{font-size:15px; font-weight:700; color:var(--c); margin-bottom:2px}
.sem .jahr{font-size:13px; color:var(--soft); margin-bottom:12px}
.mod{display:flex; align-items:center; gap:10px; width:100%; text-align:left; border:0; background:var(--t); border-radius:var(--rs); padding:10px 12px; margin-bottom:7px; cursor:pointer}
.mod:hover{outline:2px solid var(--c)}
.mod b{font-weight:600; font-size:14.5px; flex:1}
.mod i{font-style:normal; font-size:12px; color:var(--soft); white-space:nowrap}

.row2{display:grid; grid-template-columns:1.3fr 1fr; gap:14px}
.box{background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:20px}
.box h3{font-size:16px; font-weight:700; margin-bottom:12px}
.nums{display:flex; gap:26px; flex-wrap:wrap; margin-bottom:28px}
.nums div b{display:block; font-size:30px; font-weight:800; line-height:1}
.nums div span{font-size:13px; color:var(--soft)}

/* Listen */
.item{display:flex; align-items:center; gap:12px; width:100%; text-align:left; background:none; border:0; border-top:1px solid var(--line); padding:12px 2px; cursor:pointer}
.item:first-child{border-top:0}
.item:hover b{color:var(--acc)}
.item b{font-weight:600; flex:1}
.item small{color:var(--soft); font-size:12.5px; display:block; font-weight:400}
.dot{width:9px; height:9px; border-radius:50%; background:var(--c,var(--soft)); flex:none}
.pill{font-size:12px; padding:3px 10px; border-radius:99px; background:var(--bg); color:var(--soft); white-space:nowrap}
.pill.Laufend{background:var(--s1t); color:var(--s1)} .pill.Fertig{color:var(--ok)} .pill.Idee{background:var(--s2t); color:var(--s2)} .pill.Offen{background:var(--s3t); color:var(--s3)}

/* Chips */
.chips{display:flex; flex-wrap:wrap; gap:7px}
.chip{background:var(--card); border:1px solid var(--line); border-radius:99px; padding:6px 13px; font-size:13.5px; cursor:pointer; color:var(--ink)}
.chip:hover{border-color:var(--acc)}
.chip[aria-pressed="true"]{background:var(--ink); border-color:var(--ink); color:var(--bg)}
.chip.x::after{content:"  ✕"; opacity:.6}

/* Methoden */
.mgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:12px; margin-top:18px}
.mcard{background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:16px 16px 14px; text-align:left; cursor:pointer; display:flex; flex-direction:column; gap:6px}
.mcard:hover{border-color:var(--c,var(--acc)); transform:translateY(-1px)}
.mcard h4{font-size:16px; font-weight:700}
.mcard p{font-size:13.5px; color:var(--soft); margin:0; flex:1}
.mcard .ft{display:flex; justify-content:space-between; align-items:center; font-size:12px; color:var(--soft); margin-top:6px}
.mcard .rk{color:var(--acc); font-weight:600}
.bar{display:flex; gap:10px; align-items:center; flex-wrap:wrap}

/* Detail */
.back{background:none; border:0; color:var(--soft); cursor:pointer; padding:0; margin-bottom:16px; font-size:14px}
.back:hover{color:var(--ink)}
.det{display:grid; grid-template-columns:1fr 300px; gap:16px; align-items:start}
.serif{font-family:'Source Serif 4',Georgia,serif; font-size:16.5px; line-height:1.62}
.steps{list-style:none; margin:0; padding:0; counter-reset:s}
.steps li{counter-increment:s; display:flex; gap:12px; padding:10px 0; border-top:1px solid var(--line)}
.steps li:first-child{border-top:0}
.steps li::before{content:counter(s); flex:none; width:24px; height:24px; border-radius:50%; background:var(--bg); color:var(--soft); font-size:12px; font-weight:700; display:grid; place-items:center; font-family:Archivo,sans-serif}
.side .box{margin-bottom:14px}
.side h3{font-size:13.5px; color:var(--soft); font-weight:600; margin-bottom:9px}

/* Formular */
label{display:block; font-size:13px; color:var(--soft); margin:14px 0 5px; font-weight:500}
input[type=text],input[type=number],select,textarea,input[type=search]{
  width:100%; background:var(--bg); border:1px solid var(--line); border-radius:var(--rs); padding:9px 12px; font:inherit; color:var(--ink)}
textarea{min-height:80px; resize:vertical; font-family:'Source Serif 4',Georgia,serif; font-size:15.5px}
.f3{display:grid; grid-template-columns:repeat(3,1fr); gap:12px}
.btn{background:var(--ink); color:var(--bg); border:0; border-radius:99px; padding:10px 20px; cursor:pointer; font-weight:600}
.btn:hover{opacity:.88}
.btn.l{background:none; color:var(--soft); border:1px solid var(--line)}
.btn.l:hover{color:var(--ink); opacity:1}
.btn.d{background:none; color:var(--s2); border:1px solid var(--line)}
.acts{display:flex; gap:10px; flex-wrap:wrap; margin-top:20px}
.picked{min-height:32px; margin-bottom:10px}
.plist{max-height:230px; overflow-y:auto; border:1px solid var(--line); border-radius:var(--rs); padding:8px}
.plist .chip{margin:3px}

table{width:100%; border-collapse:collapse; font-size:14px}
th,td{text-align:left; padding:7px 4px; border-bottom:1px solid var(--line)}
th{font-weight:500; color:var(--soft)}
td.n{text-align:right; font-variant-numeric:tabular-nums}
.ovf{overflow-x:auto}

/* Karteikarten */
.flash{background:var(--card); border:1px solid var(--line); border-radius:20px; min-height:260px; padding:34px 28px; cursor:pointer; display:flex; flex-direction:column; justify-content:center; text-align:center; position:relative; overflow:hidden}
.flash::before{content:""; position:absolute; left:0; top:0; bottom:0; width:6px; background:var(--c,var(--acc))}
.flash .q{font-size:22px; font-weight:700; max-width:34ch; margin:0 auto}
.flash .a{font-family:'Source Serif 4',Georgia,serif; font-size:16px; line-height:1.65; text-align:left; max-width:54ch; margin:18px auto 0; padding-top:18px; border-top:1px solid var(--line)}
.flash .h{font-size:13px; color:var(--soft); margin-top:16px}
.prog{height:6px; background:var(--line); border-radius:99px; overflow:hidden; margin:16px 0 8px}
.prog i{display:block; height:100%; background:var(--acc); border-radius:99px}

.empty{border:1.5px dashed var(--line); border-radius:var(--r); padding:30px; text-align:center; color:var(--soft)}
.meta{font-size:13px; color:var(--soft)}
:focus-visible{outline:2px solid var(--acc); outline-offset:2px}

@media (max-width:860px){
  .weg{grid-template-columns:1fr}
  .row2,.det{grid-template-columns:1fr}
  .top .srch{width:160px}
}
@media (max-width:640px){
  .topin{flex-wrap:wrap; gap:10px; padding:10px 16px}
  .tabs{order:3; flex:0 0 100%; overflow-x:auto; scrollbar-width:none}
  .tabs button{padding:7px 11px}
  .logo{flex:1; text-align:left}
  .tools-r{margin-left:auto}
  .top .srch{width:130px}
  .wrap{padding:22px 16px 50px}
  .f3{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.mcard{transition:transform .12s, border-color .12s}
.grid{display:grid; gap:12px}
.g3{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.row{display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-top:14px}
.btn.sec{background:none; color:var(--soft); border:1px solid var(--line)}

/* Wissensnetz */
.seg{display:inline-flex; background:var(--card); border:1px solid var(--line); border-radius:99px; padding:3px; gap:2px; flex-wrap:wrap}
.seg button{background:none; border:0; border-radius:99px; padding:7px 14px; cursor:pointer; color:var(--soft); font-weight:500}
.seg button[aria-selected="true"]{background:var(--ink); color:var(--bg)}
.netzwrap{display:grid; grid-template-columns:1fr 310px; gap:14px; margin-top:16px; align-items:start}
.netz{background:var(--card); border:1px solid var(--line); border-radius:var(--r); height:min(84vh,900px); min-height:460px; overflow:hidden; touch-action:none}
.nzpanel{position:sticky; top:84px; max-height:min(84vh,900px); overflow-y:auto}
.wrap.wide{max-width:1440px}
.netz .web circle{fill:none; stroke:var(--line); stroke-width:1}
.netz .web line{stroke:var(--line); stroke-width:1; stroke-dasharray:2 4}
.netz .lk{stroke:var(--soft); stroke-opacity:.35; stroke-width:1.2}
.netz .lk.quer{stroke-dasharray:4 4; stroke-opacity:.45}
.netz .lk.on{stroke:var(--ink); stroke-opacity:.9; stroke-width:2}
.netz .lk.dim{stroke-opacity:.06}
.netz .nd text.lb{font:500 13px Archivo,sans-serif; fill:var(--ink); paint-order:stroke; stroke:var(--card); stroke-width:3.5px; stroke-linejoin:round; pointer-events:none}
.netz .nd.bereich text.lb{font-weight:700; font-size:14px}
.netz .nd.root text.lb{font-weight:800; font-size:18px}
.netz .nd.root text.lbr{font-size:10px; text-anchor:middle; pointer-events:none}
.netz .nd{transition:opacity .15s}
.netz .nd.dim{opacity:.18}
.netz .nd.on circle,.netz .nd.hit circle{stroke:var(--ink); stroke-width:3}
.netz .nd:focus{outline:none}
.netz .nd:focus-visible circle{stroke:var(--acc); stroke-width:3.5}
@media (max-width:860px){
  .seg{flex-wrap:nowrap; overflow-x:auto; max-width:100%}
  .seg button{padding:7px 11px; white-space:nowrap}
  #nzq{width:100% !important}
  .netzwrap{grid-template-columns:1fr}
  .nzpanel{position:static; max-height:none}
  .netz{height:62vh; min-height:400px}
}
</style>
</head>
<body>
<header class="top"><div class="topin">
  <button class="logo" type="button" data-go="uebersicht">Register<span>.</span></button>

    <input type="search" class="srch" id="q" placeholder="Suchen" autocomplete="off" aria-label="Suchen">
    <button class="icon" id="themeBtn" type="button" aria-label="Hell oder dunkel">◐</button>
  </div>
</div></header>
<main class="wrap" id="view"></main>

/* ====================== SPEICHER ====================== */
const LS = "hfwi-register-v1";
const store = {
  db:null, mode:"lokal",
  async init(){
    try{
      if(window.claude && claude.use){
        const d = await claude.use("db");
        if(d){ this.db = d; this.mode = "synchron"; }
      }
    }catch(e){ }
    const el = null;
    if(el) el.textContent = this.mode;
  },
  local(){ try{ return JSON.parse(localStorage.getItem(LS)||'{"projekte":[],"lern":{}}'); }catch(e){ return {projekte:[],lern:{}}; } },
  saveLocal(o){ try{ localStorage.setItem(LS, JSON.stringify(o)); }catch(e){} },
  async projekte(){
    if(this.db){
      try{
        const s = await this.db.collection("projekte").get();
        return s.docs.map(d => Object.assign({id:d.id}, d.data()));
      }catch(e){ }
    }
    return this.local().projekte;
  },
  async saveProjekt(p){
    if(this.db){
      try{ await this.db.doc("projekte/"+p.id).set(p); return true; }catch(e){ }
    }
    const o = this.local();
    const i = o.projekte.findIndex(x=>x.id===p.id);
    if(i>=0) o.projekte[i]=p; else o.projekte.push(p);
    this.saveLocal(o); return true;
  },
  async delProjekt(id){
    if(this.db){ try{ await this.db.doc("projekte/"+id).delete(); return true; }catch(e){ } }
    const o = this.local(); o.projekte = o.projekte.filter(x=>x.id!==id); this.saveLocal(o); return true;
  },
  async lern(){
    if(this.db){
      try{ const s = await this.db.doc("lernen/status").get(); if(s.exists) return s.data().k||{}; }catch(e){ }
    }
    return this.local().lern||{};
  },
  async saveLern(k){
    if(this.db){ try{ await this.db.doc("lernen/status").set({k:k}); return; }catch(e){ } }
    const o = this.local(); o.lern = k; this.saveLocal(o);
  }
};

const nf = (x,d) => (isFinite(x)? Number(x).toLocaleString("de-CH",{minimumFractionDigits:d==null?2:d, maximumFractionDigits:d==null?2:d}) : "–");
function num(id){ const v = parseFloat((document.getElementById(id)||{}).value); return isFinite(v)?v:0; }

const CALC = {
subnet(){
  return {html:`
    <div class="grid g3">
      <div><label for="c-ip">IP-Adresse</label><input type="text" id="c-ip" value="192.168.10.37"></div>
      <div><label for="c-pre">Präfix</label><input type="number" id="c-pre" value="26" min="1" max="32"></div>
    </div>
    <div class="row"><button class="btn" type="button" id="c-go">Berechnen</button></div>
    <div id="c-out" style="margin-top:14px"></div>`,
   run(){
    const ip = (document.getElementById("c-ip").value||"").trim().split(".").map(Number);
    const pre = Math.min(32, Math.max(1, num("c-pre")));
    const out = document.getElementById("c-out");
    if(ip.length!==4 || ip.some(x=>!isFinite(x)||x<0||x>255)){ out.innerHTML = '<p class="meta">Die IP-Adresse braucht vier Zahlen von 0 bis 255.</p>'; return; }
    const m = pre===0?0:(0xFFFFFFFF << (32-pre))>>>0;
    const a = ((ip[0]<<24)>>>0)+(ip[1]<<16)+(ip[2]<<8)+ip[3];
    const net = (a & m)>>>0, bc = (net | (~m>>>0))>>>0;
    const d = x => [(x>>>24)&255,(x>>>16)&255,(x>>>8)&255,x&255].join(".");
    const hosts = pre>=31 ? (pre===31?2:1) : Math.pow(2,32-pre)-2;
    out.innerHTML = `<table>
      <tr><th>Netzmaske</th><td>${d(m)}</td></tr>
      <tr><th>Netzadresse</th><td>${d(net)}/${pre}</td></tr>
      <tr><th>Erste Hostadresse</th><td>${pre<31?d(net+1):"–"}</td></tr>
      <tr><th>Letzte Hostadresse</th><td>${pre<31?d(bc-1):"–"}</td></tr>
      <tr><th>Broadcast</th><td>${pre<31?d(bc):"–"}</td></tr>
      <tr><th>Nutzbare Hosts</th><td>${nf(hosts,0)}</td></tr>
      <tr><th>Wildcard</th><td>${d((~m)>>>0)}</td></tr></table>`;
   }};
},
invest(){
  return {html:`
    <div class="grid g3">
      <div><label for="c-an">Anschaffungswert (CHF)</label><input type="number" id="c-an" value="120000"></div>
      <div><label for="c-rf">Rückfluss pro Jahr (CHF)</label><input type="number" id="c-rf" value="32000"></div>
      <div><label for="c-nd">Nutzungsdauer (Jahre)</label><input type="number" id="c-nd" value="5"></div>
      <div><label for="c-zs">Kalkulationszins (%)</label><input type="number" id="c-zs" value="6" step="0.1"></div>
      <div><label for="c-rw">Restwert (CHF)</label><input type="number" id="c-rw" value="10000"></div>
    </div>
    <div class="row"><button class="btn" type="button" id="c-go">Berechnen</button></div>
    <div id="c-out" style="margin-top:14px"></div>`,
   run(){
    const an=num("c-an"), rf=num("c-rf"), nd=Math.max(1,Math.round(num("c-nd"))), i=num("c-zs")/100, rw=num("c-rw");
    let bar=0; for(let t=1;t<=nd;t++) bar += rf/Math.pow(1+i,t);
    bar += rw/Math.pow(1+i,nd);
    const kw = bar - an;
    const amo = rf>0 ? an/rf : Infinity;
    const abschr = (an-rw)/nd;
    const gewinn = rf - abschr;
    const kap = (an+rw)/2;
    const rend = kap>0 ? gewinn/kap*100 : 0;
    document.getElementById("c-out").innerHTML = `<table>
      <tr><th>Barwert aller Rückflüsse</th><td class="n">${nf(bar)}</td></tr>
      <tr><th>Kapitalwert (NPV)</th><td class="n" style="color:${kw>=0?'var(--ok)':'var(--plum)'}">${nf(kw)}</td></tr>
      <tr><th>Amortisationsdauer</th><td class="n">${isFinite(amo)?nf(amo,1)+" Jahre":"–"}</td></tr>
      <tr><th>Kalkulatorische Abschreibung pro Jahr</th><td class="n">${nf(abschr)}</td></tr>
      <tr><th>Durchschnittlicher Gewinn pro Jahr</th><td class="n">${nf(gewinn)}</td></tr>
      <tr><th>Rentabilität auf dem Durchschnittskapital</th><td class="n">${nf(rend,1)} %</td></tr></table>
      <p class="meta" style="margin-top:10px">${kw>=0?"Kapitalwert über null, die Investition erwirtschaftet mehr als den Kalkulationszins.":"Kapitalwert unter null, die geforderte Verzinsung wird nicht erreicht."}</p>`;
   }};
},

/* ====================== WISSENSNETZ ====================== */
let NZ = {sim:null, sel:null, map:"wi", nodes:[], links:[], adj:{}};

function baueNetz(key){
  const def = NETZE[key];
  const nodes = [], links = [], byName = {};
  const add = n => { nodes.push(n); byName[n.name]=n; return n; };
  const root = add({id:"r", name:def.n, typ:"root", d:def.d, g:-1});
  def.b.forEach((b,gi)=>{
    const bn = add({id:"b"+gi, name:b.n, typ:"bereich", d:b.d, g:gi});
    links.push({source:root.id, target:bn.id, typ:"baum"});
    b.t.forEach((t,ti)=>{
      const tool = t[1] ? toolById(t[1]) : null;
      let n = byName[t[0]];
      if(!n){
        n = add({id:"t"+gi+"_"+ti, name:t[0], typ:"thema", g:gi, tool:tool?tool.id:null,
                 d: t[2] || (tool?tool.kurz:""), mods: tool?(tool.m||[]):[]});
      }
      links.push({source:bn.id, target:n.id, typ:"baum"});
    });
  });
  (def.x||[]).forEach(([a,b])=>{ if(byName[a]&&byName[b]) links.push({source:byName[a].id, target:byName[b].id, typ:"quer"}); });
  const adj = {}; nodes.forEach(n=>adj[n.id]=new Set());
  links.forEach(l=>{ adj[l.source].add(l.target); adj[l.target].add(l.source); });
  return {nodes, links, adj, def};
}

    <div style="display:flex;gap:10px;align-items:center"><span class="meta" id="nzhint"></span><input type="search" id="nzq" class="srch" placeholder="Thema im Netz finden" style="width:220px"></div>

function panelHtml(n){
  if(!n){
    const d = NETZE[NZ.map];
    return `<h3 style="color:var(--soft);font-size:13px;font-weight:600">${esc(d.n)}</h3>
      <p class="serif" style="font-size:15.5px">${esc(d.d)}</p>
      <div class="chips" style="margin-top:12px">${d.b.map((b,i)=>`<button class="chip" type="button" data-nzsel="b${i}" style="border-color:${NETZFARBEN[i%NETZFARBEN.length]}">${esc(b.n)}</button>`).join("")}</div>`;
  }
  const col = n.g>=0 ? NETZFARBEN[n.g%NETZFARBEN.length] : "var(--ink)";
  const nb = Array.from(NZ.adj[n.id]).map(id=>NZ.nodes.find(x=>x.id===id)).filter(Boolean)
             .sort((a,b)=>({root:0,bereich:1,thema:2}[a.typ]-({root:0,bereich:1,thema:2}[b.typ])));
  const typ = {root:"Fachgebiet", bereich:"Bereich", thema: n.tool?"Methode":"Thema"}[n.typ];
  const mods = (n.mods||[]).map(modByK).filter(Boolean);
  return `
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px"><span class="dot" style="background:${col}"></span><span class="meta">${typ}</span></div>
    <h3 style="font-size:20px;margin-bottom:10px">${esc(n.name)}</h3>
    ${n.d?`<p class="serif" style="font-size:15.5px">${esc(n.d)}</p>`:""}
    ${n.tool?`<button class="btn" type="button" data-tool="${n.tool}" style="margin:6px 0 14px">Methode öffnen</button>`:""}
    ${mods.length?`<div class="meta" style="margin:6px 0 6px">Gelernt in</div><div class="chips">${mods.map(m=>`<button class="chip" type="button" data-mod="${m.k}">${esc(m.n)}</button>`).join("")}</div>`:""}
    <div class="meta" style="margin:16px 0 6px">Verbunden mit</div>
    <div class="chips">${nb.map(x=>`<button class="chip" type="button" data-nzsel="${x.id}">${esc(x.name)}</button>`).join("")}</div>
    <p style="margin-top:16px"><button class="back" type="button" data-nzsel="" style="margin:0">Auswahl aufheben</button></p>`;
}

function mountNetz(){
  const host = document.getElementById("netz");
  document.getElementById("nzpanel").innerHTML = panelHtml(null);
  if(NZ.sim){ NZ.sim.stop(); NZ.sim=null; }
  if(!window.d3){
    host.innerHTML = `<div class="empty" style="border:0">Die Grafik konnte nicht geladen werden. Die Bereiche findest du rechts als Liste.</div>`;
    return;
  }
  const G = baueNetz(NZ.map);
  NZ.nodes = G.nodes; NZ.links = G.links; NZ.adj = G.adj; NZ.sel = null;
  const W = host.clientWidth || 800, H = host.clientHeight || 600;
  const nB = G.def.b.length;
  const R1 = 160, R2 = 340;
  // Feste Zielpositionen: Themen gleichmässig auf dem äusseren Ring, Bereiche in der Mitte ihrer Themen
  const themen = G.nodes.filter(n=>n.typ==="thema");
  const T = themen.length;
  themen.forEach((n,i)=>{ n.a = (i+0.5)/T*Math.PI*2 - Math.PI/2; n.tx = Math.cos(n.a)*R2; n.ty = Math.sin(n.a)*R2; });
  G.nodes.filter(n=>n.typ==="bereich").forEach(b=>{
    const eig = themen.filter(t=>t.g===b.g);
    let sx=0, sy=0; eig.forEach(t=>{ sx+=Math.cos(t.a); sy+=Math.sin(t.a); });
    b.a = Math.atan2(sy, sx); b.tx = Math.cos(b.a)*R1; b.ty = Math.sin(b.a)*R1;
  });
  G.nodes.forEach(n=>{
    if(n.typ==="root"){ n.tx=0; n.ty=0; n.fx=0; n.fy=0; }
    n.x = n.tx; n.y = n.ty;
  });
  const svg = d3.select(host).html("").append("svg")
    .attr("viewBox",[-W/2,-H/2,W,H]).attr("width","100%").attr("height","100%").attr("role","img").attr("aria-label","Wissensnetz "+G.def.n);
  const g = svg.append("g");
  // Netzringe
  const web = g.append("g").attr("class","web");
  [R1*0.5,R1,(R1+R2)/2,R2,R2+60].forEach(r=>web.append("circle").attr("r",r));
  G.nodes.filter(n=>n.typ==="bereich").forEach(b=>web.append("line").attr("x1",0).attr("y1",0).attr("x2",Math.cos(b.a)*(R2+60)).attr("y2",Math.sin(b.a)*(R2+60)));

  const link = g.append("g").selectAll("line").data(G.links).join("line")
    .attr("class",d=>"lk "+d.typ);
  const node = g.append("g").selectAll("g").data(G.nodes).join("g")
    .attr("class",d=>"nd "+d.typ).attr("tabindex",0).style("cursor","pointer");
  node.append("circle")
    .attr("r",d=>d.typ==="root"?34:d.typ==="bereich"?14:(d.tool?7.5:6))
    .attr("fill",d=>d.typ==="root"?"var(--ink)":NETZFARBEN[d.g%NETZFARBEN.length])
    .attr("stroke","var(--card)").attr("stroke-width",d=>d.typ==="thema"?1.5:2.5)
    .attr("fill-opacity",d=>d.typ==="thema"&&!d.tool?0.55:1);
  node.append("text").attr("class","lb")
    .text(d=>d.name)
    .attr("dy",d=>d.typ==="root"?56:"0.34em");
  node.filter(d=>d.typ==="root").append("text").attr("class","lbr").attr("dy","0.34em").text("●").attr("fill","var(--bg)");

  const sim = d3.forceSimulation(G.nodes)
    .force("x", d3.forceX(d=>d.tx).strength(d=>d.typ==="thema"?0.55:0.7))
    .force("y", d3.forceY(d=>d.ty).strength(d=>d.typ==="thema"?0.55:0.7))
    .force("link", d3.forceLink(G.links).id(d=>d.id).strength(0))
    .force("collide", d3.forceCollide(d=>d.typ==="root"?44:d.typ==="bereich"?18:8))
    .alpha(0.6).alphaDecay(0.05);
  NZ.sim = sim;

  function tick(){
    link.attr("x1",d=>d.source.x).attr("y1",d=>d.source.y).attr("x2",d=>d.target.x).attr("y2",d=>d.target.y);
    node.attr("transform",d=>`translate(${d.x},${d.y})`);
    node.select("text.lb").each(function(d){
      if(d.typ==="root"){ this.setAttribute("text-anchor","middle"); return; }
      const deg = Math.atan2(d.y, d.x)*180/Math.PI;
      const links = d.x < 0;
      const off = d.typ==="bereich" ? 20 : 12;
      this.setAttribute("transform", "rotate(" + (links ? deg+180 : deg) + ")");
      this.setAttribute("text-anchor", links ? "end" : "start");
      this.setAttribute("dx", links ? -off : off);
    });
  }
  sim.on("tick", tick);
  NZ.node = node; NZ.link = link;

  const zoom = d3.zoom().extent([[-W/2,-H/2],[W/2,H/2]]).scaleExtent([0.3,3.5]).on("zoom", e=>g.attr("transform", e.transform));
  svg.call(zoom);
  const k = Math.min(W/2/(R2+175), H/2/(R2+175));
  svg.call(zoom.transform, d3.zoomIdentity.scale(Math.max(0.3,Math.min(1.2,k))));
  NZ.zoom = zoom; NZ.svg = svg;

  node.call(d3.drag()
    .on("start",(e,d)=>{ if(!e.active) sim.alphaTarget(0.2).restart(); d.fx=d.x; d.fy=d.y; })
    .on("drag",(e,d)=>{ d.fx=e.x; d.fy=e.y; })
    .on("end",(e,d)=>{ if(!e.active) sim.alphaTarget(0); if(d.typ!=="root"){ d.fx=null; d.fy=null; } }));

  node.on("click",(e,d)=>{ e.stopPropagation(); waehle(d.id, false); })
      .on("keydown",(e,d)=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); waehle(d.id,false); } })
      .on("mouseenter",(e,d)=>{ if(!NZ.sel) hebeHervor(d.id); })
      .on("mouseleave",()=>{ if(!NZ.sel) hebeHervor(null); });
  svg.on("click",()=>waehle(null));
  NZ.node = node; NZ.link = link;
}

function hebeHervor(id){
  if(!NZ.node) return;
  if(!id){ NZ.node.classed("dim",false).classed("on",false); NZ.link.classed("dim",false).classed("on",false); return; }
  const nb = NZ.adj[id];
  NZ.node.classed("dim",d=>d.id!==id && !nb.has(d.id)).classed("on",d=>d.id===id);
  NZ.link.classed("dim",l=>l.source.id!==id && l.target.id!==id).classed("on",l=>l.source.id===id||l.target.id===id);
}

function waehle(id, zentrieren){
  NZ.sel = id || null;
  const n = id ? NZ.nodes.find(x=>x.id===id) : null;
  hebeHervor(NZ.sel);
  const p = document.getElementById("nzpanel"); if(p) p.innerHTML = panelHtml(n);
  if(n && zentrieren!==false && NZ.svg && NZ.zoom){
    const t = d3.zoomTransform(NZ.svg.node());
    const s = Math.max(t.k, 0.9);
    NZ.svg.transition().duration(450).call(NZ.zoom.transform, d3.zoomIdentity.scale(s).translate(-n.x, -n.y));
  }
  if(n && window.innerWidth<860 && p){ p.scrollIntoView({behavior:"smooth", block:"nearest"}); }
}

function bindNetz(){
  const q = document.getElementById("nzq");
  if(q){
    const treffer = s => {
      const inName = NZ.nodes.filter(d=>d.name.toLowerCase().includes(s));
      return inName.length ? inName : NZ.nodes.filter(d=>(d.d||"").toLowerCase().includes(s));
    };
    q.addEventListener("input", e=>{
      const s = e.target.value.trim().toLowerCase();
      const hint = document.getElementById("nzhint");
      if(!NZ.node) return;
      if(s.length<2){ NZ.node.classed("hit",false); hebeHervor(NZ.sel); if(hint) hint.textContent=""; return; }
      const ids = new Set(treffer(s).map(d=>d.id));
      if(hint) hint.textContent = ids.size ? ids.size+" Treffer, Enter zum Anspringen" : "Nichts gefunden";
      if(!ids.size){ NZ.node.classed("hit",false); hebeHervor(NZ.sel); return; }
      NZ.node.classed("hit", d=>ids.has(d.id)).classed("dim", d=>!ids.has(d.id));
      NZ.link.classed("dim", true).classed("on", false);
    });
    q.addEventListener("keydown", e=>{
      if(e.key!=="Enter") return;
      const s = e.target.value.trim().toLowerCase();
      const n = treffer(s)[0];
      if(n){ NZ.node.classed("hit",false); waehle(n.id, true); const h=document.getElementById("nzhint"); if(h) h.textContent=""; }
    });
  }
  mountNetz();
}

  const aktiv = {methode:"methoden", projekt:"projekte"}[S.v] || S.v;
  document.getElementById("nav").innerHTML = NAV.map(x=>
    `<button type="button" data-go="${x.v}" aria-current="${aktiv===x.v}">${x.n}</button>`).join("");
}
function go(v,id){ if(NZ.sim&&v!=="netz"){ NZ.sim.stop(); NZ.sim=null; NZ.node=null; } S.v=v; S.id=id||null; S.q=""; document.getElementById("q").value=""; renderNav(); render(); window.scrollTo(0,0); }

/* ====================== ÜBERSICHT ====================== */
function vUebersicht(){
  const p = S.projekte;
  const offen = p.filter(x=>x.status==="Laufend"||x.status==="Offen");
  const gek = Object.values(S.stat).filter(x=>x>0).length;
  const weg = [1,2,3].map(s=>`
    <section class="sem" style="${semVar(s)}">
      <h2>${SEMINFO[s].n}</h2><div class="jahr">${SEMINFO[s].z}</div>
      ${MODULE.filter(m=>m.s===s).map(m=>{
        const n = (m.tl||[]).length;
        return `<button class="mod" type="button" data-mod="${m.k}"><b>${esc(m.n)}</b><i>${n?n+" Methoden":"Inhalt folgt"}</i></button>`;
      }).join("")}
    </section>`).join("");
  return `
  <div class="hero">
    <h1>Hallo Yusi</h1>
    <p>Dein Studium an einem Ort. Tipp ein Modul an, um die Methoden daraus zu sehen.</p>
  </div>
  <div class="nums">
    <div><b>${MODULE.length}</b><span>Module</span></div>
    <div><b>${WERKZEUGE.length}</b><span>Methoden</span></div>
    <div><b>${p.length}</b><span>Projekte</span></div>
    <div><b>${gek}</b><span>Karten gekonnt</span></div>
  </div>
  <div class="weg">${weg}</div>
  <div class="row2">
    <div class="box">
      <h3>Woran du gerade arbeitest</h3>
      ${offen.length? offen.slice(0,5).map(itemProjekt).join("")
        : `<div class="empty">Noch kein laufendes Projekt.<div style="margin-top:12px"><button class="btn" type="button" data-neu="1">Projekt erfassen</button></div></div>`}
    </div>
    <div class="box">
      <h3>Wissensnetz</h3>
      <div class="chips" style="margin-bottom:18px">
        <button class="chip" type="button" data-gonetz="wi">Wirtschaftsinformatik</button>
        <button class="chip" type="button" data-gonetz="inf">Informatik</button>
        <button class="chip" type="button" data-gonetz="wirt">Wirtschaft</button>
      </div>
      <h3>Rechner</h3>
      <div class="chips">
        <button class="chip" type="button" data-tool="subnetting">Subnetz</button>
        <button class="chip" type="button" data-tool="invest">Kapitalwert</button>
        <button class="chip" type="button" data-tool="kalk-handel">Handelskalkulation</button>
        <button class="chip" type="button" data-tool="nutzwert">Nutzwertanalyse</button>
        <button class="chip" type="button" data-tool="zinseszins">Zinseszins</button>
      </div>
    </div>
  </div>`;
}
function itemProjekt(x){
  return `<button class="item" type="button" data-projekt="${esc(x.id)}">
    <span class="dot"></span><b>${esc(x.titel)}<small>${esc(x.kontext||"")}${x.datum?" · "+esc(x.datum):""}</small></b>
    <span class="pill ${esc(x.status)}">${esc(x.status)}</span></button>`;
}

/* ====================== METHODEN ====================== */
function vMethoden(){
  const kats = ["Alle", ...Array.from(new Set(WERKZEUGE.map(t=>t.kat))).sort()];
  let list = WERKZEUGE.filter(t=>S.kat==="Alle"||t.kat===S.kat);
  const m = S.mod ? modByK(S.mod) : null;
  if(m) list = list.filter(t=>(t.m||[]).includes(m.k));
  return `
  <div class="hero">
    <h1>${m?esc(m.n):"Methoden"}</h1>
    <p>${m?`${esc(SEMINFO[m.s].n)}. ${esc(m.pruef)}`:"Nachschlagen, wie es geht und wofür. Fünf davon rechnen für dich."}</p>
  </div>
  <div class="bar">
    ${m?`<button class="chip x" type="button" data-clearmod="1" aria-pressed="true">${esc(m.k)}</button>`:""}
    <div class="chips">${kats.map(k=>`<button class="chip" type="button" data-kat="${esc(k)}" aria-pressed="${S.kat===k}">${esc(k)}</button>`).join("")}</div>
  </div>
  ${m && m.t ? `<details class="box" style="margin-top:16px"><summary style="cursor:pointer;font-weight:600">Themen im Modul</summary>
     <div class="serif" style="margin-top:12px">${m.t.map(t=>`<p style="margin-bottom:10px"><b style="font-family:Archivo,sans-serif;font-size:14.5px">${esc(t.h)}</b><br>${esc(t.p.join(", "))}</p>`).join("")}</div></details>`:""}
  ${list.length? `<div class="mgrid">${list.map(cardMethode).join("")}</div>`
    : `<div class="empty" style="margin-top:18px">Zu diesem Modul sind noch keine Methoden hinterlegt.</div>`}`;
}
function cardMethode(t){
  return `<button class="mcard" type="button" data-tool="${t.id}" style="${semVar(toolSem(t))}">
    <h4>${esc(t.n)}</h4><p>${esc(t.kurz)}</p>
    <div class="ft"><span>${esc(t.kat)}</span>${t.calc?'<span class="rk">Rechner</span>':""}</div></button>`;
}

function vMethode(){
  const t = toolById(S.id); if(!t) return vMethoden();
  const mods = (t.m||[]).map(modByK).filter(Boolean);
  const proj = S.projekte.filter(p=>(p.tools||[]).includes(t.id));
  return `
  <button class="back" type="button" data-go="methoden">‹ Alle Methoden</button>
  <div class="hero"><h1>${esc(t.n)}</h1><p>${esc(t.kurz)}</p></div>
  <div class="det">
    <div>
      ${t.calc?`<div class="box" style="margin-bottom:14px"><h3>Rechnen</h3><div id="calc"></div></div>`:""}
      <div class="box"><h3>So gehst du vor</h3><ol class="steps serif">${t.s.map(x=>`<li>${esc(x)}</li>`).join("")}</ol></div>
    </div>
    <aside class="side">
      <div class="box"><h3>Wofür</h3><p class="serif" style="margin:0;font-size:15.5px">${esc(t.wf)}</p></div>
      <div class="box"><h3>Gelernt in</h3><div class="chips">${mods.map(m=>`<button class="chip" type="button" data-mod="${m.k}">${esc(m.n)}</button>`).join("")}</div></div>
      <div class="box"><h3>Bei dir angewendet</h3>
        ${proj.length? proj.map(itemProjekt).join("")
          : `<p class="meta">Noch nicht.</p><button class="btn l" type="button" data-neu="${t.id}">Projekt damit erfassen</button>`}
      </div>
    </aside>
  </div>`;
}

/* ====================== PROJEKTE ====================== */
function vProjekte(){
  const p = S.projekte.slice().sort((a,b)=>(b.datum||"").localeCompare(a.datum||""));
  return `
  <div class="hero"><h1>Projekte</h1><p>Was du mit dem Gelernten gelöst hast, bei der Arbeit, im Verein oder privat.</p></div>
  <div style="margin-bottom:18px"><button class="btn" type="button" data-neu="1">Neues Projekt</button></div>
  ${p.length? `<div class="box">${p.map(itemProjekt).join("")}</div>`
    : `<div class="empty">Noch nichts abgelegt. Wenn du das nächste Mal eine Methode bei der Arbeit einsetzt, halte es hier fest.</div>`}`;
}

function vProjekt(){
  const neu = S.id==="neu";
  if(!S.entwurf || S.entwurf._for!==S.id){
    const p = neu ? {id:uid(), titel:"", kontext:"Arbeit", status:"Laufend", datum:new Date().toISOString().slice(0,10),
                     problem:"", loesung:"", erkenntnis:"", tools:(S.vorTool?[S.vorTool]:[]), module:[]}
                  : S.projekte.find(x=>x.id===S.id);
    if(!p) return vProjekte();
    S.entwurf = JSON.parse(JSON.stringify(p)); S.entwurf._for = S.id; S.pickQ="";
  }
  const e = S.entwurf;
  return `
  <button class="back" type="button" data-go="projekte">‹ Alle Projekte</button>
  <div class="hero"><h1>${neu?"Neues Projekt":esc(e.titel||"Projekt")}</h1></div>
  <div class="det">
    <div class="box">
      <label for="f-titel" style="margin-top:0">Titel</label>
      <input type="text" id="f-titel" value="${esc(e.titel)}" placeholder="Zum Beispiel: Berechtigungen beim Kunden neu aufgebaut">
      <label for="f-problem">Was war das Problem?</label>
      <textarea id="f-problem">${esc(e.problem||"")}</textarea>
      <label for="f-loesung">Wie hast du es gelöst?</label>
      <textarea id="f-loesung">${esc(e.loesung||"")}</textarea>
      <label for="f-erkenntnis">Was nimmst du mit?</label>
      <textarea id="f-erkenntnis">${esc(e.erkenntnis||"")}</textarea>
      <div class="acts">
        <button class="btn" type="button" id="save">Speichern</button>
        <button class="btn l" type="button" data-go="projekte">Abbrechen</button>
        ${neu?"":`<button class="btn d" type="button" id="del">Löschen</button>`}
      </div>
    </div>
    <aside class="side">
      <div class="box">
        <label for="f-kontext" style="margin-top:0">Wo</label>
        <select id="f-kontext">${KONTEXT.map(k=>`<option ${e.kontext===k?"selected":""}>${k}</option>`).join("")}</select>
        <label for="f-status">Stand</label>
        <select id="f-status">${STATUS.map(k=>`<option ${e.status===k?"selected":""}>${k}</option>`).join("")}</select>
        <label for="f-datum">Datum</label>
        <input type="text" id="f-datum" value="${esc(e.datum||"")}">
      </div>
      <div class="box">
        <h3>Methoden</h3>
        <div class="chips picked" id="picked">${pickedHtml()}</div>
        <input type="search" id="pickq" placeholder="Methode suchen" value="${esc(S.pickQ)}">
        <div class="plist" id="plist" style="margin-top:8px">${plistHtml()}</div>
      </div>
    </aside>
  </div>`;
}
function pickedHtml(){
  const a = S.entwurf.tools||[];
  return a.length ? a.map(i=>{const t=toolById(i); return t?`<button class="chip x" type="button" data-pick="${t.id}" aria-pressed="true">${esc(t.n)}</button>`:"";}).join("")
                  : `<span class="meta">Noch keine gewählt.</span>`;
}
function plistHtml(){
  const q = S.pickQ.toLowerCase(), a = S.entwurf.tools||[];
  return WERKZEUGE.filter(t=>!a.includes(t.id) && (!q || (t.n+" "+t.kat).toLowerCase().includes(q)))
    .map(t=>`<button class="chip" type="button" data-pick="${t.id}">${esc(t.n)}</button>`).join("") || `<span class="meta">Nichts gefunden.</span>`;
}
function syncForm(){
  const e = S.entwurf; if(!e) return;
  const g = id => { const x=document.getElementById(id); return x?x.value:null; };
  ["titel","problem","loesung","erkenntnis","kontext","status","datum"].forEach(f=>{ const v=g("f-"+f); if(v!=null) e[f]=v; });
}
function bindForm(){
  const pq = document.getElementById("pickq");
  if(pq) pq.addEventListener("input", ev=>{ S.pickQ = ev.target.value; document.getElementById("plist").innerHTML = plistHtml(); });
  const save = document.getElementById("save");
  if(save) save.onclick = async ()=>{
    syncForm();
    const d = Object.assign({}, S.entwurf); delete d._for;
    d.titel = (d.titel||"").trim() || "Ohne Titel";
    d.module = Array.from(new Set((d.tools||[]).flatMap(i=>(toolById(i)||{}).m||[])));
    save.textContent = "Speichert";
    await store.saveProjekt(d);
    S.projekte = await store.projekte(); S.entwurf = null; S.vorTool = null;
    go("projekte");
  };
  const del = document.getElementById("del");
  if(del) del.onclick = async ()=>{
    if(!confirm("Dieses Projekt löschen?")) return;
    await store.delProjekt(S.entwurf.id);
    S.projekte = await store.projekte(); S.entwurf = null; go("projekte");
  };
}

/* ====================== LERNEN ====================== */
function bauKarten(){
  const k = [];
  WERKZEUGE.forEach(t=>{
    if(S.lernMod!=="Alle" && !(t.m||[]).includes(S.lernMod)) return;
    k.push({id:"t-"+t.id, f:t.n, r:esc(t.kurz)+"<br><br>"+t.s.slice(0,4).map(x=>"· "+esc(x)).join("<br>"), s:toolSem(t)});
  });
  MODULE.forEach(m=>{
    if(S.lernMod!=="Alle" && S.lernMod!==m.k) return;
    m.t.forEach((t,i)=>{
      if(t.p.length===1 && /nachzutragen/.test(t.p[0])) return;
      k.push({id:"m-"+m.k+"-"+i, f:"Was gehört zu "+t.h+"?", r:t.p.map(x=>"· "+esc(x)).join("<br>"), s:m.s});
    });
  });
  return k;
}
function vLernen(){
  S.karten = bauKarten();
  const n = S.karten.length; if(S.li>=n) S.li=0;
  const c = S.karten[S.li];
  const gek = S.karten.filter(x=>(S.stat[x.id]||0)>0).length;
  return `
  <div class="hero"><h1>Lernen</h1><p>Karte antippen, Antwort prüfen, ehrlich bewerten.</p></div>
  <div style="max-width:720px">
    <select id="lernmod" aria-label="Modul wählen">
      <option value="Alle">Alle Module</option>
      ${[1,2,3].map(s=>`<optgroup label="${SEMINFO[s].n}">${MODULE.filter(m=>m.s===s).map(m=>`<option value="${m.k}" ${S.lernMod===m.k?"selected":""}>${esc(m.n)}</option>`).join("")}</optgroup>`).join("")}
    </select>
    <div class="prog"><i style="width:${n?Math.round(gek/n*100):0}%"></i></div>
    <div class="meta" style="margin-bottom:16px">${gek} von ${n} gekonnt</div>
    ${c?`
    <div class="flash" id="flash" style="${semVar(c.s)}">
      <div class="q">${esc(c.f)}</div>
      ${S.auf?`<div class="a">${c.r}</div>`:`<div class="h">Antippen zum Umdrehen</div>`}
    </div>
    <div class="acts">
      ${S.auf?`<button class="btn l" type="button" data-bew="0">Nochmal</button><button class="btn" type="button" data-bew="1">Gekonnt</button>`
             :`<button class="btn" type="button" id="flip">Umdrehen</button>`}
      <button class="btn l" type="button" data-skip="1">Weiter</button>
    </div>
    <p class="meta" style="margin-top:22px"><button class="back" type="button" id="reset" style="margin:0">Fortschritt zurücksetzen</button></p>`
    :`<div class="empty">Für dieses Modul gibt es noch keine Karten.</div>`}
  </div>`;
}

/* ====================== SUCHE ====================== */
function vSuche(){
  const q = S.q.toLowerCase();
  const tt = WERKZEUGE.filter(t=>(t.n+" "+t.kurz+" "+t.wf+" "+t.s.join(" ")+" "+t.kat).toLowerCase().includes(q));
  const mm = MODULE.filter(m=>(m.n+" "+m.k+" "+m.t.map(t=>t.h+" "+t.p.join(" ")).join(" ")).toLowerCase().includes(q));
  const pp = S.projekte.filter(p=>(p.titel+" "+(p.problem||"")+" "+(p.loesung||"")+" "+(p.erkenntnis||"")).toLowerCase().includes(q));
  const tot = tt.length+mm.length+pp.length;
  return `<div class="hero"><h1>Suche</h1><p>${tot} Treffer für „${esc(S.q)}“</p></div>
  ${!tot?`<div class="empty">Nichts gefunden. Versuch es mit einem anderen Begriff.</div>`:""}
  ${mm.length?`<div class="chips" style="margin-bottom:8px">${mm.map(m=>`<button class="chip" type="button" data-mod="${m.k}" style="${semVar(m.s)}">${esc(m.n)}</button>`).join("")}</div>`:""}
  ${pp.length?`<div class="box" style="margin-top:14px">${pp.map(itemProjekt).join("")}</div>`:""}
  ${tt.length?`<div class="mgrid">${tt.map(cardMethode).join("")}</div>`:""}`;
}

/* ====================== RENDER ====================== */
function render(){
  const v = view();
  v.classList.toggle("wide", S.v==="netz" && S.q.trim().length<2);
  if(S.q.trim().length>1){ v.innerHTML = vSuche(); return; }
  switch(S.v){
    case "methoden": v.innerHTML = vMethoden(); break;
    case "methode":  v.innerHTML = vMethode(); { const t=toolById(S.id); if(t&&t.calc) mountCalc(t.calc); } break;
    case "netz":     v.innerHTML = vNetz(); bindNetz(); break;
    case "projekte": v.innerHTML = vProjekte(); break;
    case "projekt":  v.innerHTML = vProjekt(); bindForm(); break;
    case "lernen":   v.innerHTML = vLernen(); { const s=document.getElementById("lernmod"); if(s) s.onchange = e=>{ S.lernMod=e.target.value; S.li=0; S.auf=false; render(); }; } break;
    default:         v.innerHTML = vUebersicht();
  }
}

document.addEventListener("click", ev=>{
  const b = ev.target.closest("button");
  if(!b){ if(ev.target.closest("#flash") && !S.auf){ S.auf=true; render(); } return; }
  const d = b.dataset;
  if(d.gonetz){ NZ.map=d.gonetz; go("netz"); return; }
  if(d.go){ S.entwurf=null; if(d.go==="methoden"){ S.mod=null; } go(d.go); return; }
  if(d.mod){ S.mod=d.mod; S.kat="Alle"; go("methoden"); return; }
  if(d.clearmod){ S.mod=null; render(); return; }
  if(d.tool){ go("methode", d.tool); return; }
  if(d.projekt){ S.entwurf=null; go("projekt", d.projekt); return; }
  if(d.neu!=null){ S.entwurf=null; S.vorTool = d.neu!=="1"?d.neu:null; go("projekt","neu"); return; }
  if(d.kat){ S.kat=d.kat; render(); return; }
  if(d.netz){ NZ.map=d.netz; document.querySelectorAll("[data-netz]").forEach(x=>x.setAttribute("aria-selected", x.dataset.netz===d.netz)); const q=document.getElementById("nzq"); if(q) q.value=""; mountNetz(); return; }
  if(d.nzsel!=null){ waehle(d.nzsel||null, true); return; }
  if(d.pick){
    syncForm();
    const a = S.entwurf.tools || (S.entwurf.tools=[]);
    const i = a.indexOf(d.pick); if(i>=0) a.splice(i,1); else a.push(d.pick);
    document.getElementById("picked").innerHTML = pickedHtml();
    document.getElementById("plist").innerHTML = plistHtml();
    return;
  }
  if(d.bew!=null){ const c=S.karten[S.li]; if(c){ S.stat[c.id]= d.bew==="1"?1:0; store.saveLern(S.stat);} S.li=(S.li+1)%Math.max(1,S.karten.length); S.auf=false; render(); return; }
  if(d.skip){ S.li=(S.li+1)%Math.max(1,S.karten.length); S.auf=false; render(); return; }
  if(b.id==="flip"){ S.auf=true; render(); return; }
  if(b.id==="reset"){ if(confirm("Lernfortschritt zurücksetzen?")){ S.stat={}; store.saveLern({}); render(); } return; }
  if(b.id==="themeBtn"){
    const dunkelJetzt = getComputedStyle(document.documentElement).getPropertyValue("--bg").trim().toLowerCase()==="#0f1416";
    const neu = dunkelJetzt ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", neu);
    try{ localStorage.setItem("hfwi-theme", neu); }catch(e){}
  }
});
document.getElementById("q").addEventListener("input", e=>{ S.q=e.target.value; render(); });

(async function(){
  try{ const th=localStorage.getItem("hfwi-theme"); if(th) document.documentElement.setAttribute("data-theme", th); }catch(e){}
  renderNav(); render();
  await store.init();
  S.projekte = await store.projekte();
  S.stat = await store.lern();
  render();
})();
</script>
</body>
</html>
